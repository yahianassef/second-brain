    } catch (err) {
      el.textContent = 'Could not reach your script: ' + err.message;
      el.closest('.sync-state').dataset.state = 'error';
    }
  }
};

const usingSheets = () => Sheets.connected() && (Sheets.data.expenses || []).length > 0;
/** Currency the finance figures are shown in (the sheets hold AED and EGP). */
const baseCur = () => {
  if (!usingSheets()) return DB.settings.currency || '$';
  const avail = currenciesAvailable();
  if (UI.finCurrency && avail.indexOf(UI.finCurrency) !== -1) return UI.finCurrency;
  return avail.indexOf('AED') !== -1 ? 'AED' : (avail[0] || 'AED');
};

function expenseUniverse() {
  if (usingSheets()) {
    const rows = (Sheets.data.expenses || []).map(r => ({
      id: r.id, row: r.row, tab: r.tab, pending: r.pending, approxDate: r.approxDate,
      month: r.month || String(r.date || '').slice(0, 7),
      date: r.date, description: r.name, amount: num(r.amount),
      category: r.category || 'Uncategorised', account: r.method || '',
      currency: r.currency || 'AED', type: 'Expense', source: 'sheet'
    }));
    // Your sheets hold expenses only, so income stays app-side and joins the same view.
    const income = (DB.transactions || [])
      .filter(x => x.type === 'Income' && !incomeCoversMonth(String(x.date || '').slice(0, 7)))
      .map(x => ({
      id: x.id, date: x.date, month: String(x.date || '').slice(0, 7),
      description: x.description, amount: num(x.amount),
      category: x.category, account: x.account,
      currency: x.currency || 'AED', type: 'Income', source: 'local'
    }));
    return rows.concat(income);
  }
  return (DB.transactions || []).map(x => ({
    id: x.id, date: x.date, month: String(x.date || '').slice(0, 7),
    description: x.description, amount: num(x.amount),
    category: x.category, account: x.account, currency: DB.settings.currency || '$',
    type: x.type, source: 'local'
  }));
}

/** All currencies present, so the picker only offers what actually exists. */
const currenciesAvailable = () => [...new Set(expenseUniverse().map(x => x.currency))].filter(Boolean).sort();

const endOfMonth = m => {
  const [y, mo] = m.split('-').map(Number);
  return `${m}-${pad(new Date(y, mo, 0).getDate())}`;
};

/** [from, to] for the active date filter. */
function rangeBounds() {
  const m = UI.finMonth;
  switch (UI.finRange || 'month') {
    case 'prev': { const p = shiftMonth(m, -1); return [p + '-01', endOfMonth(p)]; }
    case '3m': return [shiftMonth(m, -2) + '-01', endOfMonth(m)];
    case '6m': return [shiftMonth(m, -5) + '-01', endOfMonth(m)];
    case 'year': return [m.slice(0, 4) + '-01-01', m.slice(0, 4) + '-12-31'];
    case 'all': return ['0000-01-01', '9999-12-31'];
    case 'custom': return [UI.finFrom || '0000-01-01', UI.finTo || '9999-12-31'];
    default: return [m + '-01', endOfMonth(m)];
  }
}
const rangeLabel = () => ({
  month: monthLabel(UI.finMonth, true),
  prev: monthLabel(shiftMonth(UI.finMonth, -1), true),
  '3m': `${monthLabel(shiftMonth(UI.finMonth, -2))} – ${monthLabel(UI.finMonth, true)}`,
  '6m': `${monthLabel(shiftMonth(UI.finMonth, -5))} – ${monthLabel(UI.finMonth, true)}`,
  year: UI.finMonth.slice(0, 4),
  all: 'All time',
  custom: `${UI.finFrom ? fmtDate(UI.finFrom) : 'start'} – ${UI.finTo ? fmtDate(UI.finTo) : 'now'}`
}[UI.finRange || 'month']);

/** Expenses inside the active date range and currency. */
function filteredExpenses() {
  const [from, to] = rangeBounds();
  const cur = baseCur();
  return expenseUniverse()
    .filter(x => x.date && x.date >= from && x.date <= to)
    .filter(x => !usingSheets() || x.currency === cur)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

/** Months that actually contain data, newest first — drives the month picker. */
function monthsWithData() {
  const set = new Set(expenseUniverse().filter(x => x.date).map(x => x.date.slice(0, 7)));
  set.add(today().slice(0, 7));   // the current month is always selectable
  return [...set].sort().reverse();
}

/** The sheet tab a row of this month + currency belongs to, or null if none exists yet. */
function sheetTabFor(dateStr, currency) {
  const tabs = (Sheets.data.meta && Sheets.data.meta.tabs) || [];
  const m = String(dateStr || today()).slice(0, 7);
  const cur = currency || 'AED';
  return tabs.find(t => t.month === m && (t.currency || 'AED') === cur) || null;
}

/** Currencies offered when adding — whatever exists, plus the two the sheets use. */
function currencyChoices() {
  return [...new Set([...currenciesAvailable(), 'AED', 'EGP'])].filter(Boolean);
}

/** Tells you where a row will be written before you press save. */
function sheetFormHint(kind, item, vals) {
  if (kind !== 'expense') {
    return item ? `Saves to row ${item.row || '—'} of your sheet.` : 'Appended to the bottom of the table in your sheet.';
  }
  if (item && item.row && !item.pending) {
    return `Saves to row ${item.row} of <b>${esc(item.tab || 'your sheet')}</b>.`;
  }
  const cur = vals.currency || baseCur();
  const hit = sheetTabFor(vals.date, cur);
  const label = monthLabel(String(vals.date || today()).slice(0, 7), true);
  return hit
    ? `Appended to <b>${esc(hit.name)}</b> in your Expenses sheet.`
    : `No ${esc(cur)} tab for ${esc(label)} yet — one will be created from your newest tab's layout.`;
}

/* =========================================================
   CREDIT CARDS — one sheet tab per card, charges summing to the debt.
   Card charges are deliberately NOT expenses: the payment is what gets
   copied into a month tab, so counting both would double up.
   ========================================================= */
const cardList = () => (Sheets.data.cards || []).filter(c => c && c.name);

/* =========================================================
   INCOME FROM THE SHEET — the "Starting …" block on a month tab.
   Its cells hold what landed in each account; the Notes column beside them can
   name money that arrived elsewhere ("Salary + 720 From Egypt + 850 Company"),
   and that counts too. Months the sheet does not cover keep using app income.
   ========================================================= */
const incomeList = () => (Sheets.data.income || []).filter(i => i && i.month);
const incomeCoversMonth = m => incomeList().some(i => i.month === m);
function incomeFor(m) {
  const rows = incomeList().filter(i => i.month === m);
  if (!rows.length) return null;
  const cur = typeof baseCur === 'function' ? baseCur() : 'AED';
  return rows.find(i => (i.currency || 'AED') === cur) || rows[0];
}

/** Income, account by account, with the notes that explain it. */
function incomeCard(m, span = 'span-6') {
  const inc = incomeFor(m);
  if (!inc) return '';
  const cur = inc.currency || 'AED';
  const lines = (inc.lines || []).filter(l => num(l.amount) || num(l.extraTotal));
  return `<div class="card ${span}">
    ${cardHead('arrowDown', `Income · ${monthLabel(m, true)}`, `<span class="hint">${esc(inc.heading || '')}</span>`)}
    <div style="font-size:26px;font-weight:700;letter-spacing:-.03em;margin:-6px 0 12px">${esc(curMoney(inc.total, cur))}</div>
    <div class="mini-list">
      ${lines.map(l => `<div class="prog-row" style="padding:9px 2px">
        <div class="top"><span>${esc(l.label)}${l.carried ? ' <span class="chip slate">carried over</span>' : ''}</span><b>${esc(curMoney(l.amount, cur))}</b></div>
        ${l.note ? `<div class="row-sub" style="white-space:normal">${esc(l.note)}</div>` : ''}
        ${(l.extras || []).length ? `<div class="row-sub txt-blue" style="white-space:normal">+ ${l.extras.map(n => esc(curMoney(n, cur))).join(' + ')} named in the note, counted on top</div>` : ''}
      </div>`).join('')}
    </div>
    <div class="p-foot">
      <span>${esc(curMoney(inc.accounts, cur))} in the accounts</span>
      ${num(inc.extraTotal) ? `<span class="txt-blue">+ ${esc(curMoney(inc.extraTotal, cur))} from the notes</span>` : ''}
      ${num(inc.carried) ? `<span class="muted">incl. ${esc(curMoney(inc.carried, cur))} carried over</span>` : ''}
    </div>
  </div>`;
}
const cardDebtTotal = cur => sum(cardList().filter(c => (c.currency || 'AED') === (cur || 'AED')), c => c.debt);
const cardCurrencies = () => [...new Set(cardList().map(c => c.currency || 'AED'))];
const curMoney = (v, cur) => (cur || 'AED') + ' ' + num(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* =========================================================
   CREDIT-CARD SWITCHER — one card in focus, flip between them
   ========================================================= */
const CARD_PREF = 'secondBrain.finCard';
const sortedCards = () => [...cardList()].sort((a, b) => num(b.debt) - num(a.debt) || String(a.name).localeCompare(String(b.name)));
/** The card in focus ('' = All cards). Restored lazily so it works before UI exists. */
function selectedCardName() {
  if (UI.finCard === undefined) {
    try { UI.finCard = localStorage.getItem(CARD_PREF) || ''; } catch (e) { UI.finCard = ''; }
  }
  return sortedCards().some(c => c.name === UI.finCard) ? UI.finCard : '';
}
function pickCard(name) {
  UI.finCard = name || '';
  try { localStorage.setItem(CARD_PREF, UI.finCard); } catch (e) { /* ignore */ }
  render();
  // keep the chosen tile in view without jolting the page vertically
  requestAnimationFrame(() => {
    const tile = document.querySelector('.cc-tile.on');
    if (tile && tile.parentElement) tile.parentElement.scrollTo({ left: Math.max(0, tile.offsetLeft - 16), behavior: 'smooth' });
  });
}
function cycleCard(dir) {
  const names = ['', ...sortedCards().map(c => c.name)];
  const i = names.indexOf(selectedCardName());
  pickCard(names[(i + dir + names.length) % names.length]);
}
/** A steady colour per card, kept inside the app's blue family. */
function cardGradient(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const hue = 196 + (h % 52);
  return `linear-gradient(135deg, hsl(${hue} 88% 44%) 0%, hsl(${hue + 18} 78% 26%) 62%, hsl(${hue + 30} 70% 16%) 100%)`;
}
/** Share of the (owed + available) line in use, or null when the tab has no figure. */
function cardUsage(c) {
  if (c.available === null || c.available === undefined) return null;
  const line = num(c.debt) + num(c.available);
  return line > 0 ? Math.min(100, num(c.debt) / line * 100) : 0;
}
function cardCategories(c) {
  const cats = {};
  (c.rows || []).filter(r => !r.paid).forEach(r => { const k = r.category || 'Uncategorised'; cats[k] = (cats[k] || 0) + num(r.amount); });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]);
}
function cardRail(cards, selected) {
  const allOwed = cardCurrencies().map(cur => curMoney(cardDebtTotal(cur), cur)).join(' · ');
  return `<div class="cc-rail" role="tablist" aria-label="Credit cards">
    <button class="cc-tile cc-all${!selected ? ' on' : ''}" role="tab" aria-selected="${!selected}" data-act="pickCard" data-val="">
      <span class="cc-top"><span class="cc-name">All cards</span>${icon('layers', 17)}</span>
      <span class="cc-owed">${allOwed}</span>
      <span class="cc-sub">${plural(cards.length, 'card')} · ${sum(cards, c => c.unpaid)} open</span>
    </button>
    ${cards.map(c => `<button class="cc-tile${selected === c.name ? ' on' : ''}" role="tab" aria-selected="${selected === c.name}" data-act="pickCard" data-val="${esc(c.name)}" style="--cc:${cardGradient(c.name)}">
      <span class="cc-top"><span class="cc-name">${esc(c.name)}</span><span class="cc-chip"></span></span>
      <span class="cc-owed">${curMoney(c.debt, c.currency)}</span>
      <span class="cc-sub">${plural(c.unpaid, 'open charge')}${c.available !== null && c.available !== undefined ? ` · ${curMoney(c.available, c.currency)} free` : ''}</span>
    </button>`).join('')}
  </div>`;
}

/* ---------- paying off card charges ---------- */
/** Marks a charge paid/unpaid on screen at once, then queues the write to the sheet. */
function setCardPaid(cardName, row, paid, quiet) {
  const card = cardList().find(c => c.name === cardName);
  const r = card && (card.rows || []).find(x => x.row === row);
  if (!r) return false;
  r.paid = !!paid;
  r.pending = true;
  card.debt = Math.round(sum(card.rows.filter(x => !x.paid), x => x.amount) * 100) / 100;
  card.unpaid = card.rows.filter(x => !x.paid).length;
  const box = Sheets.out.cardStatus || (Sheets.out.cardStatus = []);
  const i = box.findIndex(s => s.card === cardName && s.row === row);
  if (i >= 0) box.splice(i, 1);                     // latest tap wins; nothing piles up
  box.push({ card: cardName, row, name: r.name, amount: r.amount, paid: !!paid });
  Sheets.saveCache();
  if (!quiet) Sheets.queue(true);
  return true;
}
/** Fresh data from the sheet must not undo a tap that has not been sent yet. */
function reapplyCardStatus() {
  (Sheets.out.cardStatus || []).forEach(s => {
    const card = cardList().find(c => c.name === s.card);
    const r = card && (card.rows || []).find(x => x.row === s.row && x.name === s.name);
    if (!r) return;
    r.paid = s.paid; r.pending = true;
    card.debt = Math.round(sum(card.rows.filter(x => !x.paid), x => x.amount) * 100) / 100;
    card.unpaid = card.rows.filter(x => !x.paid).length;
  });
}
/** Why a card can't be toggled, or '' when it can. */
function cardStatusBlocker(card) {
  if (!card) return 'Card not found';
  if (card.statusCol === undefined) return 'Update the Apps Script to save payment status — see the note on the Cards page';
  if (card.statusCol === false) return `“${card.name}” has no Payment Status column — add one to its tab to track payments`;
  return '';
}
function toggleCardPaid(cardName, row) {
  const card = cardList().find(c => c.name === cardName);
  const why = cardStatusBlocker(card);
  if (why) { toast(why, { tone: 'error' }); return; }
  const r = (card.rows || []).find(x => x.row === row);
  if (!r) return;
  const paid = !r.paid;
  setCardPaid(cardName, row, paid);
  render();
  toast(`${r.name} marked ${paid ? 'paid' : 'unpaid'}`, {
    action: 'Undo', onAction: () => { setCardPaid(cardName, row, !paid); render(); }
  });
}
function markCardAllPaid(cardName) {
  const card = cardList().find(c => c.name === cardName);
  const why = cardStatusBlocker(card);
  if (why) { toast(why, { tone: 'error' }); return; }
  const open = (card.rows || []).filter(x => !x.paid);
  if (!open.length) { toast('Nothing open on this card'); return; }
  open.forEach(r => setCardPaid(cardName, r.row, true, true));
  Sheets.queue(true);
  render();
  toast(`${plural(open.length, 'charge')} marked paid on ${cardName}`, {
    action: 'Undo', onAction: () => { open.forEach(r => setCardPaid(cardName, r.row, false, true)); Sheets.queue(true); render(); }
  });
}
const payPill = (card, r) => `<button class="pay-pill${r.paid ? ' on' : ''}${r.pending ? ' busy' : ''}" data-act="toggleCardPaid" data-card="${esc(card.name)}" data-row="${r.row}"${card.statusCol === false ? ' disabled' : ''} title="${r.paid ? 'Paid — tap to mark unpaid' : 'Unpaid — tap to mark paid'}">${r.paid ? 'Paid' : 'Unpaid'}</button>`;

// swipe the focused card left/right on touch screens
(function () {
  let sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    tracking = !!(e.target.closest && e.target.closest('.cc-detail'));
    if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 45) cycleCard(dx < 0 ? 1 : -1);
  }, { passive: true });
})();


/* =========================================================
   SORTING & GROUPING for the transactions list
   ========================================================= */
function sortTx(list) {
  const copy = [...list];
  switch (UI.txSort || 'date') {
    case 'amount': return copy.sort((a, b) => num(b.amount) - num(a.amount));
    case 'oldest': return copy.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    case 'category': return copy.sort((a, b) =>
      String(a.category || 'Uncategorised').localeCompare(String(b.category || 'Uncategorised')) ||
      num(b.amount) - num(a.amount));
    default: return copy.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }
}
const groupedByCategory = () => (UI.txSort || 'date') === 'category';

/** [category, rows, spend] biggest spend first; income is excluded from the spend. */
function byCategory(list) {
  const map = new Map();
  list.forEach(x => {
    const k = x.category || 'Uncategorised';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(x);
  });
  return [...map.entries()]
    .map(([k, rows]) => [k, rows, sum(rows.filter(r => r.type !== 'Income'), r => r.amount)])
    .sort((a, b) => b[2] - a[2]);
}

const TX_SORTS = [['date', 'Newest first'], ['oldest', 'Oldest first'], ['amount', 'Largest amount'], ['category', 'Category (grouped)']];

/** Spending by category for whatever range is on screen. */
function categoryChart(list) {
  const groups = byCategory(list.filter(x => x.type !== 'Income')).filter(g => g[2] > 0);
  if (!groups.length) return '';
  const total = sum(groups, g => g[2]);
  const shown = groups.slice(0, 9);
  const rest = groups.slice(9);
  if (rest.length) shown.push([`${rest.length} more categories`, [], sum(rest, g => g[2])]);
  const top = shown[0][2] || 1;
  return `<div class="card" style="margin-bottom:16px">
    ${cardHead('pie', `Spending by category · ${esc(rangeLabel())}`, `<span class="hint">${money(total)}</span>`)}
    ${shown.map(([name, , amt], i) => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:6px"><span>${esc(name)}</span><span class="mono hint">${money(amt)} · ${Math.round(amt / total * 100)}%</span></div>
      <div class="bar"><i style="width:${Math.max(2, amt / top * 100)}%;background:${CAT_COLORS[i % CAT_COLORS.length]};box-shadow:none"></i></div>
    </div>`).join('')}
  </div>`;
}

/** Add or edit a row that lives in Google Sheets. */
function openSheetForm(kind, item = null) {
  const base = SHEET_FORMS[kind];
  // "addOnly" fields (currency) make no sense when editing — the row's tab already fixes it
  const cfg = { ...base, fields: base.fields.filter(f => !(f.addOnly && item)) };
  if (!Sheets.connected()) {
    toast('Connect Google Sheets first', { tone: 'error' });
    Sheets.openPanel();
    return;
  }
  const vals = {};
  cfg.fields.forEach(f => {
    vals[f.k] = item ? item[f.k] : ((typeof f.def === 'function' ? f.def() : f.def) ?? '');
  });
  const canDelete = item && item.row && !item.pending;
  const m = openModal(`
    <div class="modal-head">
      <div><div class="eyebrow">${item ? 'Edit' : 'New'} · Google Sheets</div><h3>${item ? esc(item[cfg.fields[0].k] || cfg.noun) : cfg.noun}</h3></div>
      <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button>
    </div>
    <form class="modal-body" novalidate autocomplete="off">
      <div class="form-grid">${cfg.fields.map(f => fieldHTML(f, vals)).join('')}</div>
      <p class="hint" style="margin-top:12px" data-hint>${sheetFormHint(kind, item, vals)}</p>
    </form>
    <div class="modal-foot">
      ${canDelete ? `<button class="btn btn-danger" data-del>${icon('trash', 15)} <span>Delete</span></button>` : ''}
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-save>${icon('check', 15)} ${item ? 'Save to sheet' : 'Add to sheet'}</button>
    </div>`, cfg.wide);

  const form = $('form', m);
  const refreshHint = () => {
    const h = $('[data-hint]', m);
    if (h) h.innerHTML = sheetFormHint(kind, item, readForm(form, cfg));
  };
  form.addEventListener('input', e => { e.target.closest('.field')?.classList.remove('invalid'); refreshHint(); });
  form.addEventListener('change', refreshHint);

  const submit = () => {
    const data = readForm(form, cfg);
    $$('.field', form).forEach(el => el.classList.remove('invalid'));
    const missing = cfg.fields.filter(f => f.req && (data[f.k] === '' || data[f.k] == null));
    if (missing.length) {
      missing.forEach(f => $(`.field[data-k="${f.k}"]`, form).classList.add('invalid'));
      toast('Please fill in the required fields', { tone: 'error' });
      return;
    }
    if (item && item.row && !item.pending) {
      Sheets.editRow(kind, item.row, data, item.tab || '');
      toast(`${cfg.noun} updated — saving to your sheet`);
    } else {
      Sheets.addRow(kind, data);
      toast(`${cfg.noun} added — saving to your sheet`);
    }
    closeModal();
    render();
  };
  $('[data-save]', m).onclick = submit;
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
  });
  if (canDelete) {
    $('[data-del]', m).onclick = () => {
      Sheets.removeRow(kind, item.row, item.tab || '');
      closeModal(); render();
      toast(`${cfg.noun} deleted from your sheet`);
    };
  }
}

/** One transaction line on the phone, with category headings when grouping. */
function mTxRow(x) {
  return `<div class="item" data-act="${x.source === 'sheet' ? 'sheetEdit' : 'edit'}" data-kind="expense" data-type="transactions" data-id="${esc(x.id)}">

      <span class="amt ${x.type}">${x.type === 'Income' ? '+' : '−'}${money(num(x.amount), 2)}</span></div>`;
}
function mTxRows(list) {
  if (!groupedByCategory()) return list.map(mTxRow).join('');

  return byCategory(list).map(([cat, rows, spend]) =>

const statTile = (ic, label, value, sub, cls = '', act = '') => `<div class="stat"${act ? ` data-act="go" data-val="${act}"` : ''}><div class="label">${icon(ic, 14)}${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
const dateBlock = (s, late, soon) => { const d = parseDate(s); return `<div class="date-block${late ? ' late' : soon ? ' soon' : ''}"><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined, { month: 'short' })}</span></div>`; };
const moodChip = m => m ? `<span class="chip" style="color:${MOOD_COLORS[m - 1]};border-color:${MOOD_COLORS[m - 1]}55;background:${MOOD_COLORS[m - 1]}18"><span class="dot"></span>${LISTS.moods[m - 1]}</span>` : '';
const entryCount = n => n + ' ' + (n === 1 ? 'entry' : 'entries');
const barTone = pct => pct > 100 ? 'red' : pct >= 85 ? 'amber' : '';
function ring(pct, size = 74, stroke = 7) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(100, pct) / 100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="ring-bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/><circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle">${Math.round(pct)}%</text></svg>`;
}
function miniChart(endMonth, n = 6) {
  const months = []; for (let i = n - 1; i >= 0; i--) months.push(shiftMonth(endMonth, -i));
  const data = months.map(m => ({ m, ...monthTotals(m) }));
  const max = Math.max(100, ...data.map(d => Math.max(d.income, d.expense))) * 1.1;
  const W = 340, H = 150, pl = 34, pb = 20, pt = 6, cw = (W - pl) / n, bw = Math.min(14, cw / 3.4);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and expenses, last ${n} months"><defs><linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00B4FF"/><stop offset="1" stop-color="#0066FF"/></linearGradient><linearGradient id="gEx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B6B8C"/><stop offset="1" stop-color="#2F3A50"/></linearGradient></defs>`;
  for (let i = 0; i <= 3; i++) { const v = max * i / 3, yy = y(v).toFixed(1); s += `<line class="grid" x1="${pl}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="axis" x="${pl - 6}" y="${+yy + 4}" text-anchor="end" style="font-size:9px">${compact(v)}</text>`; }
  data.forEach((d, i) => {
    const cx = pl + cw * i + cw / 2;
    s += `<rect x="${(cx - bw - 1.5).toFixed(1)}" y="${y(d.income).toFixed(1)}" width="${bw}" height="${(H - pb - y(d.income)).toFixed(1)}" rx="3" fill="url(#gIn)"/>
      <rect x="${(cx + 1.5).toFixed(1)}" y="${y(d.expense).toFixed(1)}" width="${bw}" height="${(H - pb - y(d.expense)).toFixed(1)}" rx="3" fill="url(#gEx)"/>
      <text class="axis${d.m === endMonth ? ' cur' : ''}" x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" style="font-size:9.5px">${monthLabel(d.m)}</text>`;
  });
  return s + '</svg>';
}
const chartLegend = () => `<div class="legend"><span><i style="background:linear-gradient(#00B4FF,#0066FF)"></i>In</span><span><i style="background:#4A5670"></i>Out</span></div>`;

function taskItem(x) {

    ${x.status === 'In Progress' ? '<span class="chip blue">Now</span>' : ''}

}
function deadlineItem(u) {

SCREENS.tasks = () => {
  const t = today();
  const isOpen = x => x.status !== 'Done';
  const filters = {
    today: x => isOpen(x) && x.due && x.due <= t,
    open: isOpen,
    upcoming: x => isOpen(x) && x.due && x.due > t,
    done: x => !isOpen(x),
    all: () => true
  };
  const c = k => DB.tasks.filter(filters[k]).length;
  const list = DB.tasks.filter(filters[UI.taskFilter] || filters.open);
  const groups = { Overdue: [], Today: [], Tomorrow: [], 'Next 7 days': [], Later: [], 'No due date': [], Completed: [] };
  list.forEach(x => {
    if (x.status === 'Done') return groups.Completed.push(x);
    if (!x.due) return groups['No due date'].push(x);
    const n = daysUntil(x.due);
    (n < 0 ? groups.Overdue : n === 0 ? groups.Today : n === 1 ? groups.Tomorrow : n <= 7 ? groups['Next 7 days'] : groups.Later).push(x);
  });
  Object.values(groups).forEach(a => a.sort(byDue));
  const filled = Object.entries(groups).filter(([, a]) => a.length);
  const doneToday = DB.tasks.filter(x => x.completed === t).length;

  return `
  ${seg('taskFilter', [['today', 'Today', c('today')], ['open', 'Open', c('open')], ['upcoming', 'Upcoming', c('upcoming')], ['done', 'Done', c('done')], ['all', 'All', c('all')]])}
  <div class="card"><div class="row" style="justify-content:space-between">
    <div><div style="font-size:22px;font-weight:700;letter-spacing:-.03em">${DB.tasks.filter(isOpen).length}</div><div class="hint">open</div></div>
    <div><div style="font-size:22px;font-weight:700;letter-spacing:-.03em" class="${c('today') ? 'txt-amber' : ''}">${DB.tasks.filter(x => isOpen(x) && x.due && x.due < t).length}</div><div class="hint">overdue</div></div>
    <div><div style="font-size:22px;font-weight:700;letter-spacing:-.03em" class="txt-blue">${doneToday}</div><div class="hint">done today</div></div>
    <button class="btn btn-ghost sm" data-act="add" data-type="tasks">${icon('plus', 15)} Add</button>
  </div></div>
  ${filled.length ? filled.map(([name, items]) => `<div class="section-title${name === 'Overdue' ? ' late' : ''}">${name}<span class="n">${items.length}</span></div><div class="card"><div class="list">${items.map(taskItem).join('')}</div></div>`).join('')

};

/* =========================================================
   TRACKERS — habits, studying, exercising
   ========================================================= */
/** One month as a calendar heatmap. `days` maps YYYY-MM-DD to a number. */
function calHeat(month, days, opt = {}) {
  const ramp = HEAT_RAMPS[opt.ramp] || HEAT_RAMPS.blue;
  const [y, mo] = month.split('-').map(Number);
  const dim = new Date(y, mo, 0).getDate();
  const lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7;      // Monday-first grid
  const max = opt.max || Math.max(1, ...Object.values(days).map(num));
  const t = today();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-day pad"></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = `${month}-${pad(d)}`, v = num(days[ds]);
    const lvl = v > 0 ? Math.min(4, 1 + Math.floor(v / max * 3.999)) : 0;
    const tip = opt.label ? opt.label(ds, v) : fmtDate(ds);
    const act = opt.act && ds <= t ? ' ' + opt.act(ds, v) : '';
    cells += `<div class="cal-day${lvl >= 3 ? ' lit' : ''}${ds === t ? ' today' : ''}${ds > t ? ' future' : ''}${act ? ' tap' : ''}"${lvl ? ` style="background:${ramp[lvl - 1]}"` : ''} title="${esc(tip)}"${act}>${opt.mini ? '' : d}</div>`;
  }
  const head = opt.mini ? '' : `<div class="cal-head">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span>${x}</span>`).join('')}</div>`;
  return `<div class="cal${opt.mini ? ' mini' : ''}">${head}<div class="cal-grid">${cells}</div></div>`;
}
/** Twelve mini months — the whole year at a glance. */
function yearHeat(year, days, opt = {}) {
  const max = opt.max || Math.max(1, ...Object.values(days).map(num));
  let out = '';
  for (let m = 1; m <= 12; m++) {
    const key = `${year}-${pad(m)}`;
    const rows = Object.entries(days).filter(([d, v]) => d.slice(0, 7) === key && num(v) > 0);
    const total = rows.reduce((s, r) => s + num(r[1]), 0);
    out += `<div><h5>${monthLabel(key, false)}</h5>${calHeat(key, days, { ...opt, mini: true, max, act: null })}
      <div class="m-sub">${opt.sub ? opt.sub(rows.length, total) : plural(rows.length, 'day')}</div></div>`;
  }
  return `<div class="year-grid">${out}</div>`;
}
const heatLegend = (ramp = 'blue') => `<div class="heat-legend"><span>Less</span><i style="background:var(--surface-3)"></i>${(HEAT_RAMPS[ramp] || HEAT_RAMPS.blue).map(c => `<i style="background:${c}"></i>`).join('')}<span>More</span></div>`;
/** The heatmap card: month/year switch, a month stepper, the grid and its legend. */
function heatCard(ic, title, days, opt = {}) {
  const year = UI.heatMonth.slice(0, 4);
  const label = UI.heatScope === 'year' ? year : `${monthLabel(UI.heatMonth)} ${year}`;
  const body = UI.heatScope === 'year' ? yearHeat(year, days, opt) : calHeat(UI.heatMonth, days, opt);
  return `<div class="card">
    ${cardHead(ic, title)}
    <div class="row" style="gap:8px;margin-bottom:10px">
      <button class="btn btn-ghost sm" data-act="heatShift" data-val="-1" aria-label="Earlier">${icon('chevL', 16)}</button>
      <button class="btn btn-ghost sm" style="flex:1" data-act="heatNow">${label}</button>
      <button class="btn btn-ghost sm" data-act="heatShift" data-val="1" aria-label="Later">${icon('chevR', 16)}</button>
    </div>
    ${seg('heatScope', [['month', 'Month'], ['year', 'Year']])}
    ${opt.pick || ''}
    ${body}
    <div class="row-gap" style="margin-top:12px;justify-content:space-between">${opt.foot || '<span class="hint"></span>'}${heatLegend(opt.ramp)}</div>
  </div>`;
}
/** Mon–Sun dots for one week: filled where the day is in `days`. */
function weekDots(days, color = 'var(--blue-2)', ws = weekStart()) {
  return `<div class="week-dots" style="--c:${esc(color)}">${weekDates(ws).map(ds =>
    `<i class="${days.has(ds) ? 'on' : ''}${ds === today() ? ' now' : ''}" title="${esc(fmtDate(ds, { weekday: 'short', month: 'short', day: 'numeric' }))}"></i>`).join('')}</div>`;
}
/** Log rows grouped under a date heading — shared by studying and exercising. */
function dayGroups(rows, rowHTML, totalLabel) {
  const by = {};
  rows.forEach(r => { (by[r.date] = by[r.date] || []).push(r); });
  return Object.keys(by).sort((a, b) => b.localeCompare(a)).map(d => `
    <div class="day-head"><span>${esc(fmtDate(d, { weekday: 'short', month: 'short', day: 'numeric' }))}${d === today() ? ' · today' : ''}</span><b>${totalLabel(by[d])}</b></div>
    ${by[d].map(rowHTML).join('')}`).join('');
}
/** The habit checklist — the same rows on the Home screen and the Habits screen. */
function habitChecklist(habits, idx, t = today()) {
  return habits.map(h => {
    const on = idx.has(habitKey(h.id, t)), c = habitColor(h), st = habitStreak(h.id), target = num(h.target) || 7;
    return `<div class="item" style="--c:${esc(c)}">

      ${weekDots(habitDays(h.id), c)}
    </div>`;
  }).join('');
}

  if (!rows.length) return `<div class="card">${emptyState('wrench', 'No service records', 'Tap + to add one.', `<button class="btn btn-primary" data-act="sheetAdd" data-kind="service">${icon('plus', 16)} Log service</button>`)}</div>`;

        <div class="s">${r.odometer ? r.odometer.toLocaleString() + ' km' : 'No odometer'}</div></div>

function fuelWithDeltasM() {
  const rows = [...(Sheets.data.fuel || [])];
  const byOdo = [...rows].filter(r => r.odometer > 0).sort((a, b) => a.odometer - b.odometer);
  const prev = new Map();
  byOdo.forEach((r, i) => { if (i) prev.set(r.id, byOdo[i - 1]); });
  return rows.sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.odometer - a.odometer).map(r => {
    const p = prev.get(r.id);
    const km = p ? r.odometer - p.odometer : 0;
    const days = p && p.date && r.date ? Math.round((parseDate(r.date) - parseDate(p.date)) / 86400000) : 0;
    return { ...r, km, days };
  });
}

  $('#nav').innerHTML = NAV.map(n => {
    const on = UI.view === n.k || (n.k === 'more' && SUBVIEWS.includes(UI.view));
    return `<button data-view="${n.k}" class="${on ? 'on' : ''}" aria-label="${n.l}">${icon(n.ic, 21)}<span>${n.l}</span>${n.k === 'tasks' && open ? `<span class="badge">${open > 99 ? '99+' : open}</span>` : ''}</button>`;
  }).join('');
}
function render() {
  $('#pageTitle').textContent = TITLES[UI.view] || 'Second Brain';
  document.title = (TITLES[UI.view] || 'Second Brain') + ' · Second Brain';
  document.body.classList.toggle('sub', SUBVIEWS.includes(UI.view));
  $('#view').innerHTML = (SCREENS[UI.view] || SCREENS.home)();
  $('#fab').hidden = !addType();
  renderNav();
  Sync.paint();
}

const ACTIONS = {
  noop() {},
  go: el => go(el.dataset.val),
  add: el => openForm(el.dataset.type, null, el.dataset.preset ? JSON.parse(el.dataset.preset) : {}),
  edit: el => { const it = find(el.dataset.type, el.dataset.id); if (it) openForm(el.dataset.type, it); },
  del: el => removeItem(el.dataset.type, el.dataset.id),
  set: el => { UI[el.dataset.key] = el.dataset.val; render(); },
  pickCard: el => pickCard(el.dataset.val),
  cycleCard: el => cycleCard(Number(el.dataset.val)),
  toggleCardPaid: el => toggleCardPaid(el.dataset.card, Number(el.dataset.row)),
  markCardAllPaid: el => {
    // two taps, so a stray click can't clear a whole card
    if (el.dataset.armed !== '1') {
      el.dataset.armed = '1';
      const label = el.innerHTML;
      el.innerHTML = 'Tap again to confirm';
      el.classList.add('btn-danger');
      setTimeout(() => { if (el.isConnected && el.dataset.armed === '1') { el.dataset.armed = ''; el.innerHTML = label; el.classList.remove('btn-danger'); } }, 3500);
      return;
    }
    markCardAllPaid(el.dataset.card);
  },
  month: el => { UI.finMonth = shiftMonth(UI.finMonth, Number(el.dataset.val)); render(); },
  heatShift: el => { UI.heatMonth = shiftMonth(UI.heatMonth, Number(el.dataset.val) * (UI.heatScope === 'year' ? 12 : 1)); render(); },
  heatNow: () => { UI.heatMonth = today().slice(0, 7); render(); },
  toggleHabit: el => {
    const h = find('habits', el.dataset.id); if (!h) return;
    const date = el.dataset.date || today();
    const on = toggleHabit(h.id, date);
    render();
    if (date !== today()) toast(`${h.name} · ${on ? 'ticked' : 'cleared'} for ${fmtDate(date, { weekday: 'short', month: 'short', day: 'numeric' })}`);
  },
  syncPanel: () => Sync.openPanel(),
  sheetsPanel: () => Sheets.openPanel(),
  notifyPanel: () => Notify.openPanel(),
  sheetSync: () => Sheets.sync('manual'),
  sheetAdd: el => openSheetForm(el.dataset.kind),
  sheetEdit: el => {
    const kind = el.dataset.kind;
    const bucket = { fuel: 'fuel', service: 'service', expense: 'expenses' }[kind];
    const item = (Sheets.data[bucket] || []).find(x => String(x.id) === el.dataset.id);
    if (item) openSheetForm(kind, item);
  },
  exportCSV: el => exportCSV(el.dataset.val),
  toggleTask: el => {
    const t = find('tasks', el.dataset.id); if (!t) return;
    const done = t.status !== 'Done';
    t.status = done ? 'Done' : 'To Do';
    t.completed = done ? today() : '';
    t.updated = today(); t.ts = Date.now();
    el.classList.toggle('on', done);
    el.closest('.item')?.classList.toggle('done', done);
    saveDB();
    setTimeout(render, 360);
    if (done) toast('Task completed', { action: 'Undo', onAction: () => { t.status = 'To Do'; t.completed = ''; t.ts = Date.now(); saveDB(); render(); } });
  },
  capture: () => {
    const input = $('#captureInput'); if (!input) return;
    const text = input.value.trim(); if (!text) { input.focus(); return; }
    if (UI.captureType === 'task') {
      DB.tasks.unshift({ id: uid(), created: today(), updated: today(), ts: Date.now(), title: text, priority: 'Medium', due: today(), status: 'To Do', projectId: '', notes: '', completed: '' });
      saveDB(); render(); toast('Task added for today');
    } else if (UI.captureType === 'note') {
      DB.notes.unshift({ id: uid(), created: today(), updated: today(), ts: Date.now(), title: text.length > 60 ? text.slice(0, 57) + '…' : text, content: text.length > 60 ? text : '', category: 'Ideas', tags: [], pinned: false });
      saveDB(); render(); toast('Note captured');
    } else {
      input.value = '';
      openForm('journal', null, { content: text });
    }
  },
  pinNote: el => { const n = find('notes', el.dataset.id); if (!n) return; n.pinned = !n.pinned; n.ts = Date.now(); saveDB(); render(); toast(n.pinned ? 'Pinned' : 'Unpinned'); },
  lessonPlus: el => {
    const c = find('courses', el.dataset.id); if (!c) return;
    const total = num(c.lessonsTotal);
    c.lessonsDone = total ? Math.min(total, num(c.lessonsDone) + 1) : num(c.lessonsDone) + 1;
    if (c.status === 'Not Started' || c.status === 'Paused') c.status = 'In Progress';
    const finished = total && c.lessonsDone >= total;
    if (finished) c.status = 'Completed';
    c.updated = today(); c.ts = Date.now();
    saveDB(); render();
    toast(finished ? 'Course completed — well done!' : `Lesson logged · ${c.lessonsDone}/${total || '?'}`);
  },
  addFunds: el => {
    const g = find('goals', el.dataset.id); if (!g) return;
    const m = openModal(`
      <div class="modal-head"><div><div class="eyebrow">Add funds</div><h3>${esc(g.name)}</h3></div><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body"><div class="field"><label for="fundAmt">Amount</label><input class="input" id="fundAmt" type="number" inputmode="decimal" min="0" step="1" placeholder="0"></div>
        <p class="hint" style="margin-top:10px">${money(num(g.saved))} of ${money(num(g.target))} saved.</p></div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" data-ok>${icon('plus', 16)} Add</button></div>`);
    const inp = $('#fundAmt', m);
    $('[data-ok]', m).onclick = () => {
      const v = Number(inp.value);
      if (!(v > 0)) { inp.closest('.field').classList.add('invalid'); return; }
      g.saved = Math.round((num(g.saved) + v) * 100) / 100; g.updated = today(); g.ts = Date.now();
      saveDB(); closeModal(); render();
      toast(goalPct(g) >= 100 ? `Goal reached: ${g.name}` : `Added ${money(v)}`);
    };
  },
  openJournal: el => {
    const j = find('journal', el.dataset.id); if (!j) return;
    openModal(`
      <div class="modal-head">
        <div><div class="eyebrow">${fmtDate(j.date, { weekday: 'long', month: 'long', day: 'numeric' })}</div><h3>${esc(j.title || 'Untitled')}</h3></div>
        <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px">${moodChip(j.mood)}<span class="hint">${wordCount(j.content)} words</span>${(j.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="prose">${richText(j.content)}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" data-jdel>${icon('trash', 16)}</button>
        <button class="btn btn-primary" data-jedit>${icon('edit', 16)} Edit entry</button>
      </div>`);
    $('[data-jedit]').onclick = () => { closeModal(); setTimeout(() => openForm('journal', j), 180); };
    $('[data-jdel]').onclick = () => { closeModal(); removeItem('journal', j.id); };
  },
  saveSettings: () => {
    DB.settings.name = $('#setName').value.trim();
    DB.settings.currency = $('#setCur').value.trim() || '$';
    DB.settings.studyWeekly = Math.max(0, num($('#setStudy').value));
    DB.settings.exerciseWeekly = Math.max(0, num($('#setEx').value));
    DB.settings.ts = Date.now();
    saveDB(); render(); toast('Preferences saved');
  },
  exportBackup: () => {
    download(`second-brain-backup-${today()}.json`, JSON.stringify({ app: 'Second Brain', exported: new Date().toISOString(), ...DB }, null, 2), 'application/json');
    toast('Backup downloaded');
  },
  loadDemo: () => confirmSheet('Load demo data?', 'Your current data on this device will be replaced with the sample set.', 'Load demo data', () => {
    const keep = DB.settings; DB = seedDB(); DB.settings = keep; saveDB(); render(); toast('Demo data loaded');
  }),
  eraseAll: () => confirmSheet('Erase everything?', 'Every project, task, transaction, journal entry, course and note is removed from this device. This cannot be undone.', 'Erase all data', () => {
    const keep = DB.settings; DB = emptyDB(); DB.settings = keep; UI.habitSel = 'all'; saveDB(); render(); toast('All data erased');
  })
};

function confirmSheet(title, text, okLabel, onOk) {
  const m = openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body"><p class="hint">${esc(text)}</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" data-ok>${esc(okLabel)}</button></div>`);
  $('[data-ok]', m).onclick = () => { closeModal(); onOk(); };
}

/* ---------- global search ---------- */
let searchHits = [];
const snippet = (text, q) => {
  const s = String(text || '').replace(/[*#`]/g, '').replace(/\s+/g, ' ');
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return s.slice(0, 70);
  return (i > 24 ? '…' : '') + s.slice(Math.max(0, i - 24), i + q.length + 40);
};
function searchAll(raw) {
  const q = raw.toLowerCase().trim(); if (!q) return [];
  const hit = (...f) => f.some(v => (Array.isArray(v) ? v.join(' ') : String(v ?? '')).toLowerCase().includes(q));
  const res = [];
  DB.tasks.forEach(t => hit(t.title, t.notes) && res.push({ type: 'tasks', id: t.id, title: t.title, meta: `${t.status}${t.due ? ' · ' + fmtDate(t.due) : ''}` }));
  DB.projects.forEach(p => hit(p.name, p.description, p.area) && res.push({ type: 'projects', id: p.id, title: p.name, meta: `${p.status} · ${p.area}` }));
  DB.notes.forEach(n => hit(n.title, n.content, n.tags, n.category) && res.push({ type: 'notes', id: n.id, title: n.title, meta: snippet(n.content, q) }));
  DB.journal.forEach(j => hit(j.title, j.content, j.tags) && res.push({ type: 'journal', id: j.id, title: j.title || fmtDate(j.date), meta: fmtDate(j.date) + ' · ' + snippet(j.content, q) }));
  DB.courses.forEach(c => hit(c.name, c.platform, c.instructor, c.notes) && res.push({ type: 'courses', id: c.id, title: c.name, meta: `${c.status} · ${coursePct(c)}%` }));
  DB.habits.forEach(h => hit(h.name, h.category, h.notes) && res.push({ type: 'habits', id: h.id, title: h.name, meta: `${h.category || 'Habit'} · ${plural(habitStreak(h.id), 'day')} streak` }));
  [...DB.study].sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(x => hit(x.subject, x.topic, x.kind) && res.push({ type: 'study', id: x.id, title: x.subject || 'Study session', meta: `${fmtDate(x.date)} · ${dur(x.minutes)}` }));
  [...DB.workouts].sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(x => hit(x.focus, x.type, x.notes) && res.push({ type: 'workouts', id: x.id, title: x.focus || x.type || 'Workout', meta: `${fmtDate(x.date)} · ${x.type} · ${dur(x.minutes)}` }));
  DB.goals.forEach(g => hit(g.name) && res.push({ type: 'goals', id: g.id, title: g.name, meta: `${money(num(g.saved))} of ${money(num(g.target))}` }));
  DB.transactions.forEach(x => hit(x.description, x.category) && res.push({ type: 'transactions', id: x.id, title: x.description, meta: `${x.type} · ${money(num(x.amount), 2)} · ${fmtDate(x.date)}` }));
  return res.slice(0, 40);
}
function renderSearch() {
  const q = $('#searchInput').value, box = $('#searchResults');
  searchHits = searchAll(q);
  if (!q.trim()) { box.innerHTML = `<p class="hint" style="padding:18px 4px">Search tasks, projects, notes, journal entries, habits, study sessions, workouts, courses, goals and transactions.</p>`; return; }
  let html = '', group = '';
  searchHits.forEach((r, i) => {
    if (r.type !== group) { group = r.type; html += `<div class="sr-group">${TYPE_META[r.type].label}</div>`; }
    html += `<button class="sr-item" data-i="${i}"><span class="sr-ico">${icon(TYPE_META[r.type].icon, 17)}</span><div><div class="sr-title">${highlight(r.title, q.trim())}</div><div class="sr-meta">${esc(r.meta)}</div></div></button>`;
  });
  box.innerHTML = html || `<div class="empty"><div class="e-ico">${icon('search', 22)}</div><h4>No results</h4><p>Nothing matches “${esc(q)}”.</p></div>`;
}
function openSearch(open) {
  $('#searchWrap').classList.toggle('open', open);
  if (open) { $('#searchInput').value = ''; renderSearch(); setTimeout(() => $('#searchInput').focus(), 80); }
}
function openHit(r) {
  if (!r) return;
  openSearch(false);
  const view = { tasks: 'tasks', projects: 'projects', notes: 'notes', journal: 'journal', courses: 'courses', habits: 'habits', study: 'study', workouts: 'exercise', goals: 'money', transactions: 'money' }[r.type];
  if (r.type === 'goals') UI.moneyTab = 'goals';
  if (r.type === 'transactions') { UI.moneyTab = 'activity'; const x = find('transactions', r.id); if (x) UI.finMonth = x.date.slice(0, 7); }
  go(view);
  const it = find(r.type, r.id);
  if (!it) return;
  if (r.type === 'journal') ACTIONS.openJournal({ dataset: { id: r.id } });
  else openForm(r.type, it);
}

/* ---------- boot ---------- */
(function boot() {
  DB = loadDB();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { toast('Browser storage is blocked — changes will not be saved', { tone: 'error' }); }
  try { const v = localStorage.getItem('secondBrain.mview'); if (TITLES[v]) UI.view = v; } catch (e) { /* ignore */ }
  document.querySelectorAll('svg[data-icon]').forEach(s => { s.outerHTML = icon(s.dataset.icon, +(s.dataset.size || 18)); });

  // Sheets should not force the keyboard open on a phone
  const _openForm = openForm;
  openForm = function (...args) {
    _openForm(...args);
    setTimeout(() => { const el = document.activeElement; if (el && el.closest && el.closest('.modal')) el.blur(); }, 90);
  };

  $('#view').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'A') return;
    e.preventDefault();
    ACTIONS[el.dataset.act]?.(el, e);
  });
  $('#view').addEventListener('input', e => {
    if (e.target.dataset.bind) {
      UI[e.target.dataset.bind] = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const again = document.querySelector(`[data-bind="${e.target.dataset.bind}"]`);
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { /* search input */ } }
    }
  });
  $('#view').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'captureInput') { e.preventDefault(); ACTIONS.capture(); } });
  $('#view').addEventListener('change', e => { if (e.target.id === 'impJson') importBackup(e.target.files[0]); });

  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
  $('#fab').addEventListener('click', () => {
    if (UI.view === 'car') { openSheetForm(UI.carTab === 'fuel' ? 'fuel' : 'service'); return; }
    if (UI.view === 'money' && UI.moneyTab === 'sheet') { openSheetForm('expense'); return; }
    const t = addType();
    if (t) openForm(t);
  });
  $('#backBtn').addEventListener('click', () => go('more'));
  $('#syncBtn').addEventListener('click', () => Sync.openPanel());
  $('#searchBtn').addEventListener('click', () => openSearch(true));
  $('#searchClose').addEventListener('click', () => openSearch(false));
  $('#searchInput').addEventListener('input', renderSearch);
  $('#searchResults').addEventListener('click', e => { const b = e.target.closest('.sr-item'); if (b) openHit(searchHits[+b.dataset.i]); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('.overlay:not(.closing)')) closeModal();
    else if ($('#searchWrap').classList.contains('open')) openSearch(false);
  });

  render();
  Sync.init();
  Sheets.init();
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!$('.overlay')) render(); } }, 60000);
})();

function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (typeof data !== 'object' || !['projects', 'tasks', 'notes'].some(k => Array.isArray(data[k]))) throw new Error('bad file');
      confirmSheet('Replace data on this device?', `Everything here will be replaced with ${file.name}.`, 'Import & replace', () => {
        DB = normalizeDB(data); delete DB.app; delete DB.exported;
        saveDB(); render(); toast('Backup imported');
      });
    } catch (e) { toast('That file is not a valid Second Brain backup', { tone: 'error' }); }
  };
  reader.readAsText(file);
}

</script>
