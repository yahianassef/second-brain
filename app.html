/* =========================================================
   SYNC — optional GitHub Gist sync, shared by the desktop and mobile apps.
   Data lives in one secret gist; each device merges item by item (newest wins)
   and honours tombstones, so edits *and* deletes travel in both directions.
   ========================================================= */
const SYNC_KEY = 'secondBrain.sync.v1';
const SYNC_FILE = 'second-brain.json';
const COLLECTIONS = ['projects', 'tasks', 'transactions', 'budgets', 'goals', 'journal', 'courses', 'notes', 'habits', 'habitLogs', 'study', 'workouts'];
const TOMB_DAYS = 120;          // how long a deletion is remembered
const AUTO_EVERY = 5 * 60000;   // background sync interval

const sortKeys = o => Object.keys(o || {}).sort().reduce((a, k) => { a[k] = o[k]; return a; }, {});
/** Stable fingerprint of a database, independent of array or key order. */
function canonDB(db) {
  const o = { settings: sortKeys(db.settings) };
  COLLECTIONS.forEach(c => {
    o[c] = [...(db[c] || [])].sort((a, b) => String(a.id).localeCompare(String(b.id))).map(x => JSON.stringify(sortKeys(x)));
  });
  o.trash = (db.trash || []).map(t => t.id + ':' + t.ts).sort();
  return JSON.stringify(o);
}
const tombMap = db => (db.trash || []).reduce((m, t) => { if (!m[t.id] || t.ts > m[t.id]) m[t.id] = t.ts; return m; }, {});

/** Merge two databases: per item the most recently touched copy wins. */
function mergeDB(local, remote) {
  const out = emptyDB();
  const tomb = tombMap(local);
  Object.entries(tombMap(remote)).forEach(([id, ts]) => { if (!tomb[id] || ts > tomb[id]) tomb[id] = ts; });
  COLLECTIONS.forEach(c => {
    const by = new Map();
    (local[c] || []).forEach(x => { if (x && x.id) by.set(x.id, x); });
    (remote[c] || []).forEach(x => {
      if (!x || !x.id) return;
      const cur = by.get(x.id);
      if (!cur || (Number(x.ts) || 0) > (Number(cur.ts) || 0)) by.set(x.id, x);
    });
    out[c] = [...by.values()]
      .filter(x => !(tomb[x.id] && tomb[x.id] >= (Number(x.ts) || 0)))
      .sort((a, b) => (Number(b.ts) || 0) - (Number(a.ts) || 0));
  });
  const cutoff = Date.now() - TOMB_DAYS * 86400000;
  out.trash = Object.entries(tomb).filter(([, ts]) => ts > cutoff).map(([id, ts]) => ({ id, ts }));
  const ls = local.settings || {}, rs = remote.settings || {};
  out.settings = (Number(rs.ts) || 0) > (Number(ls.ts) || 0) ? { ...ls, ...rs } : { ...rs, ...ls };
  return out;
}

const relTime = ms => {
  if (!ms) return 'never';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};

const Sync = {
  cfg: { token: '', gistId: '', auto: true, device: '', lastSync: 0 },
  status: 'off', message: 'Not connected', busy: false, applying: false, timer: null,

  load() {
    try { Object.assign(this.cfg, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); } catch (e) { /* ignore */ }
    if (!this.cfg.device) this.cfg.device = /Mobi|Android|iPhone|iPad/.test(navigator.userAgent) ? 'Phone' : 'Desktop';
  },
  save() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(this.cfg)); } catch (e) { /* ignore */ } },
  connected() { return !!(this.cfg.token && this.cfg.gistId); },

  init() {
    this.load();
    if (this.connected()) { this.status = 'idle'; this.message = 'Connected'; setTimeout(() => this.run('startup'), 700); }
    this.paint();
    window.addEventListener('online', () => { if (this.connected()) this.run('auto'); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && this.connected() && Date.now() - this.cfg.lastSync > 60000) this.run('auto');
    });
    setInterval(() => { if (this.connected() && this.cfg.auto && !document.hidden) this.run('auto'); }, AUTO_EVERY);
    setInterval(() => this.paint(), 30000);
  },
  /** Called after every local save; debounced so a burst of edits pushes once. */
  queue() {
    if (this.applying || !this.connected() || !this.cfg.auto) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run('auto'), 3500);
  },

  async api(path, opts = {}) {
    const res = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.cfg.token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (!res.ok) { const e = new Error(this.explain(res.status)); e.status = res.status; throw e; }
    return res.json();
  },
  explain(status) {
    if (status === 401) return 'GitHub rejected the token (401). Create a new one with the gist permission.';
    if (status === 403) return 'GitHub refused the request (403) — the token has no gist access, or you hit the rate limit.';
    if (status === 404) return 'Gist not found (404). Check the ID, or create a new gist from this panel.';
    if (status === 422) return 'GitHub could not save the file (422).';
    return 'GitHub error ' + status + '.';
  },

  async pull() {
    const gist = await this.api('/gists/' + this.cfg.gistId);
    const file = (gist.files || {})[SYNC_FILE] || Object.values(gist.files || {})[0];
    if (!file) return null;
    let content = file.content;
    if (file.truncated || content == null) content = await (await fetch(file.raw_url)).text();
    if (!String(content).trim()) return null;
    let payload;
    try { payload = JSON.parse(content); } catch (e) { throw new Error('The gist file is not valid JSON. Use Overwrite cloud to reset it.'); }
    return normalizeDB(payload && payload.data ? payload.data : payload);
  },
  async push(db) {
    const content = JSON.stringify({ app: 'Second Brain', version: 1, updated: Date.now(), device: this.cfg.device, data: db }, null, 1);
    await this.api('/gists/' + this.cfg.gistId, { method: 'PATCH', body: JSON.stringify({ files: { [SYNC_FILE]: { content } } }) });
  },
  async createGist() {
    const content = JSON.stringify({ app: 'Second Brain', version: 1, updated: Date.now(), device: this.cfg.device, data: DB }, null, 1);
    const g = await this.api('/gists', {
      method: 'POST',
      body: JSON.stringify({ description: 'Second Brain — private sync data', public: false, files: { [SYNC_FILE]: { content } } })
    });
    return g.id;
  },

  async run(mode = 'manual') {
    if (!this.connected()) { if (mode === 'manual') toast('Connect GitHub sync first', { tone: 'error' }); return; }
    if (this.busy) return;
    if (!navigator.onLine) {
      this.status = 'error'; this.message = 'Offline — changes sync when you reconnect'; this.paint();
      if (mode === 'manual') toast(this.message, { tone: 'error' });
      return;
    }
    this.busy = true; this.status = 'syncing'; this.message = 'Syncing…'; this.paint();
    try {
      const remote = await this.pull();
      const merged = remote ? mergeDB(DB, remote) : DB;
      const localChanged = canonDB(merged) !== canonDB(DB);
      const remoteChanged = !remote || canonDB(remote) !== canonDB(merged);
      if (localChanged) {
        this.applying = true;
        DB = merged;
        try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
        this.applying = false;
      }
      if (remoteChanged) await this.push(merged);
      this.cfg.lastSync = Date.now(); this.save();
      this.status = 'idle'; this.message = 'Last synced ' + new Date().toLocaleTimeString();
      if (localChanged) { try { render(); } catch (e) { /* view not ready */ } }
      if (mode === 'manual') toast(localChanged ? 'Synced — this device updated' : remoteChanged ? 'Synced — cloud updated' : 'Already up to date');
      else if (localChanged && mode !== 'startup') toast('Synced changes from another device');
    } catch (err) {
      this.applying = false;
      this.status = 'error'; this.message = err.message || 'Sync failed';
      if (mode !== 'auto') toast(this.message, { tone: 'error' });
    } finally {
      this.busy = false; this.paint();
    }
  },
  async replaceLocal() {
    try {
      const remote = await this.pull();
      if (!remote) { toast('The gist has no data yet', { tone: 'error' }); return; }
      this.applying = true;
      DB = remote;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
      this.applying = false;
      this.cfg.lastSync = Date.now(); this.save();
      render(); this.paint();
      toast('This device now matches the cloud copy');
    } catch (err) { toast(err.message, { tone: 'error' }); }
  },
  async replaceRemote() {
    try {
      await this.push(DB);
      this.cfg.lastSync = Date.now(); this.save();
      this.status = 'idle'; this.paint();
      toast('Cloud copy overwritten with this device');
    } catch (err) { toast(err.message, { tone: 'error' }); }
  },

  label() {
    if (!this.connected()) return 'Sync off';
    if (this.status === 'syncing') return 'Syncing…';
    if (this.status === 'error') return 'Sync issue';
    return this.cfg.lastSync ? 'Synced ' + relTime(this.cfg.lastSync) : 'Connected';
  },
  paint() {
    document.querySelectorAll('[data-sync-status]').forEach(el => {
      el.dataset.state = this.connected() ? this.status : 'off';
      const t = el.querySelector('[data-sync-text]');
      (t || el).textContent = this.label();
      el.title = this.message;
    });
  },
  setupCode() { return btoa(JSON.stringify({ t: this.cfg.token, g: this.cfg.gistId })); },
  applyCode(code) {
    const o = JSON.parse(atob(String(code).trim()));
    if (!o.t || !o.g) throw new Error('bad code');
    this.cfg.token = o.t; this.cfg.gistId = o.g; this.save();
  },

  /** Connect / manage panel — identical in both apps. */
  openPanel() {
    this.load();
    const on = this.connected();
    const m = openModal(`
      <div class="modal-head">
        <div><div class="eyebrow">Multi-device</div><h3>Sync with GitHub</h3></div>
        <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <div class="sync-state" data-sync-status><span class="sync-dot"></span><b data-sync-text>${esc(this.label())}</b></div>
        <p class="hint" style="margin-top:8px">${esc(on ? this.message : 'Your data stays in this browser until you connect.')}</p>
        ${on ? `
        <div class="set-section"><h4>Connected</h4>
          <p>Gist <code>${esc(this.cfg.gistId)}</code> · this device is called <b>${esc(this.cfg.device)}</b>.</p>
          <div class="form-grid">
            <div class="field"><label for="syncDevice">Device name</label><input class="input" id="syncDevice" value="${esc(this.cfg.device)}"></div>
            <div class="field"><label>Automatic sync</label><label class="toggle"><input type="checkbox" id="syncAuto"${this.cfg.auto ? ' checked' : ''}><span></span>After every change</label></div>
          </div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-primary" id="syncNow">${icon('sparkle', 15)} Sync now</button>
            <button class="btn btn-ghost" id="syncCode">${icon('upload', 15)} Copy setup code</button>
            <button class="btn btn-ghost" id="syncPull">${icon('download', 15)} Replace this device</button>
            <button class="btn btn-ghost" id="syncPush">${icon('upload', 15)} Overwrite cloud</button>
            <button class="btn btn-danger" id="syncOff">${icon('x', 15)} Disconnect</button>
          </div>
        </div>` : `
        <div class="set-section"><h4>Option 1 — paste a setup code</h4>
          <p>Fastest on a phone: on a device that is already connected, open this panel, tap <b>Copy setup code</b>, and paste it here.</p>
          <div class="field"><label for="syncPaste">Setup code</label><input class="input" id="syncPaste" placeholder="Paste the code" autocomplete="off"></div>
          <div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" id="syncUseCode">${icon('check', 15)} Connect with code</button></div>
        </div>
        <div class="set-section"><h4>Option 2 — connect with a token</h4>
          <p>On github.com open <b>Settings › Developer settings › Personal access tokens › Tokens (classic)</b>, generate a token and tick only the <b>gist</b> scope. Paste it below; leave the gist ID empty and a new secret gist is created for you.</p>
          <div class="form-grid">
            <div class="field full"><label for="syncToken">GitHub token</label><input class="input" id="syncToken" type="password" placeholder="ghp_…" autocomplete="off" spellcheck="false"></div>
            <div class="field full"><label for="syncGist">Gist ID <span class="hint">(optional)</span></label><input class="input" id="syncGist" placeholder="Leave empty to create a new gist" autocomplete="off" spellcheck="false"></div>
          </div>
          <div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" id="syncConnect">${icon('check', 15)} Connect</button></div>
        </div>`}
        <div class="set-section"><h4>How it works</h4>
          <p>Every device merges item by item — the most recently edited version of a task, note or transaction wins, and deletions are remembered for ${TOMB_DAYS} days so they cannot come back. Nothing leaves this browser until you connect.</p>
          <p><b>Keep the token private.</b> It is stored in this browser's local storage, so anyone who can use this device — or read a setup code — can reach the gist. Use a token limited to the <b>gist</b> scope, never one that can reach your repositories, and revoke it any time at github.com/settings/tokens.</p>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Close</button></div>`, true);

    const val = id => { const el = m.querySelector('#' + id); return el ? el.value.trim() : ''; };
    const armed = {};
    const confirmTwice = (btn, fn) => {
      btn.onclick = () => {
        if (!armed[btn.id]) {
          armed[btn.id] = true;
          btn.dataset.orig = btn.innerHTML;
          btn.innerHTML = 'Tap again to confirm';
          btn.classList.add('btn-danger');
          setTimeout(() => { if (armed[btn.id]) { armed[btn.id] = false; btn.innerHTML = btn.dataset.orig; if (btn.id !== 'syncOff') btn.classList.remove('btn-danger'); } }, 4000);
          return;
        }
        armed[btn.id] = false;
        fn();
      };
    };
    if (on) {
      m.querySelector('#syncNow').onclick = () => this.run('manual');
      m.querySelector('#syncDevice').onchange = e => { this.cfg.device = e.target.value.trim() || 'Device'; this.save(); };
      m.querySelector('#syncAuto').onchange = e => { this.cfg.auto = e.target.checked; this.save(); toast(this.cfg.auto ? 'Automatic sync on' : 'Automatic sync off'); };
      m.querySelector('#syncCode').onclick = async () => {
        const code = this.setupCode();
        try {
          await navigator.clipboard.writeText(code);
          toast('Setup code copied — paste it on your other device');
        } catch (e) {
          openModal(`<div class="modal-head"><h3>Setup code</h3><button class="icon-btn" data-close>${icon('x')}</button></div><div class="modal-body"><p class="hint">Copy this and paste it into the sync panel on your other device. It contains your token — do not share it.</p><textarea class="input" rows="4" readonly style="margin-top:10px">${esc(code)}</textarea></div><div class="modal-foot"><button class="btn btn-ghost" data-close>Close</button></div>`);
        }
      };
      confirmTwice(m.querySelector('#syncPull'), () => { closeModal(); this.replaceLocal(); });
      confirmTwice(m.querySelector('#syncPush'), () => { closeModal(); this.replaceRemote(); });
      confirmTwice(m.querySelector('#syncOff'), () => {
        this.cfg.token = ''; this.cfg.gistId = ''; this.cfg.lastSync = 0; this.save();
        this.status = 'off'; this.message = 'Not connected'; this.paint();
        closeModal(); toast('Sync disconnected — your data stays on this device');
      });
    } else {
      m.querySelector('#syncUseCode').onclick = () => {
        try { this.applyCode(val('syncPaste')); } catch (e) { toast('That setup code is not valid', { tone: 'error' }); return; }
        closeModal(); this.status = 'idle'; this.paint(); this.run('manual');
      };
      m.querySelector('#syncConnect').onclick = async () => {
        const token = val('syncToken');
        if (!token) { toast('Paste your GitHub token first', { tone: 'error' }); return; }
        this.cfg.token = token;
        const btn = m.querySelector('#syncConnect');
        btn.disabled = true; btn.innerHTML = 'Connecting…';
        try {
          this.cfg.gistId = val('syncGist') || await this.createGist();
          this.save();
          closeModal();
          toast('Connected to GitHub');
          this.status = 'idle'; this.paint();
          this.run('manual');
        } catch (err) {
          this.cfg.token = '';
          btn.disabled = false;
          btn.innerHTML = 'Connect';
          toast(err.message, { tone: 'error' });
        }
      };
    }
  }
};


/* =========================================================
   GOOGLE SHEETS SYNC — talks to the Apps Script Web App.
   Carries three things both ways:
     • car fuel log      (Hyundai Elantra sheet)
     • car service log   (Hyundai Elantra sheet)
     • expenses          (Expenses Sheet, current month tab)
   …and stores the whole Second Brain database in a hidden tab, so every
   device — phone, laptops, GitHub Pages — sees identical data.
   ========================================================= */
const SHEETS_KEY = 'secondBrain.sheets.v1';
const SHEETS_CACHE = 'secondBrain.sheetsCache.v1';
const POLL_MS = 15000;      // change-probe interval while the tab is visible

const Sheets = {
  cfg: { url: '', secret: '', auto: true, lastSync: 0 },
  data: { fuel: [], service: [], expenses: [], cards: [], meta: null },
  out: { newFuel: [], newService: [], newExpenses: [], edits: [], deletes: [], cardStatus: [] },
  stamp: { car: 0, expenses: 0 },
  status: 'off', message: 'Not connected', busy: false, applying: false, timer: null, poll: null,

  /* ---------- persistence ---------- */
  load() {
    try { Object.assign(this.cfg, JSON.parse(localStorage.getItem(SHEETS_KEY) || '{}')); } catch (e) { /* ignore */ }
    try {
      const c = JSON.parse(localStorage.getItem(SHEETS_CACHE) || 'null');
      if (c) { this.data = c.data || this.data; this.out = Object.assign(this.out, c.out || {}); this.stamp = c.stamp || this.stamp; }
    } catch (e) { /* ignore */ }
  },
  save() { try { localStorage.setItem(SHEETS_KEY, JSON.stringify(this.cfg)); } catch (e) { /* ignore */ } },
  saveCache() {
    try { localStorage.setItem(SHEETS_CACHE, JSON.stringify({ data: this.data, out: this.out, stamp: this.stamp })); } catch (e) { /* ignore */ }
  },
  connected() { return !!this.cfg.url; },
  pendingCount() { return this.out.newFuel.length + this.out.newService.length + this.out.newExpenses.length + this.out.edits.length + this.out.deletes.length + (this.out.cardStatus || []).length; },

  /* ---------- transport ----------
     GET for reads. POST uses text/plain so the browser treats it as a simple
     request — Apps Script never answers CORS preflights, so an
     application/json body would be blocked before it left the browser.      */
  async call(action, body = {}, method = 'POST') {
    if (!this.cfg.url) throw new Error('No Web App URL set');
    let res;
    if (method === 'GET') {
      const u = new URL(this.cfg.url);
      u.searchParams.set('action', action);
      u.searchParams.set('secret', this.cfg.secret);
      res = await fetch(u.toString(), { method: 'GET', redirect: 'follow' });
    } else {
      res = await fetch(this.cfg.url, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, secret: this.cfg.secret, ...body })
      });
    }
    if (!res.ok) throw new Error('Google returned ' + res.status + (res.status === 401 ? ' — check the deployment is set to "Anyone"' : ''));
    let out;
    try { out = await res.json(); }
    catch (e) { throw new Error('That URL did not return JSON. Make sure you copied the /exec deployment URL.'); }
    if (!out.ok) throw new Error(out.error || 'The script reported an error');
    return out;
  },

  /* ---------- queueing local changes ---------- */
  addRow(kind, row) {
    const key = { fuel: 'newFuel', service: 'newService', expense: 'newExpenses' }[kind];
    const local = { ...row, id: 'pending-' + uid(), pending: true, source: 'app' };
    this.out[key].push(row);
    const bucket = { fuel: 'fuel', service: 'service', expense: 'expenses' }[kind];
    this.data[bucket] = [...(this.data[bucket] || []), local];
    this.saveCache();
    this.queue(true);
    return local;
  },
  /** An expense row number is meaningless without its tab — every month tab has a row 7. */
  editRow(kind, sheetRow, values, tab = '') {
    this.out.edits.push({ kind, row: sheetRow, tab, values });
    const bucket = { fuel: 'fuel', service: 'service', expense: 'expenses' }[kind];
    const item = (this.data[bucket] || []).find(x => x.row === sheetRow && (!tab || x.tab === tab));
    if (item) Object.assign(item, values, { pending: true });
    this.saveCache();
    this.queue(true);
  },
  removeRow(kind, sheetRow, tab = '') {
    this.out.deletes.push({ kind, row: sheetRow, tab });
    const bucket = { fuel: 'fuel', service: 'service', expense: 'expenses' }[kind];
    this.data[bucket] = (this.data[bucket] || []).filter(x => !(x.row === sheetRow && (!tab || x.tab === tab)));
    this.saveCache();
    this.queue(true);
  },

  queue(soon) {
    if (!this.connected() || !this.cfg.auto) { this.paint(); return; }
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sync('auto'), soon ? 1200 : 4000);
    this.paint();
  },

  /* ---------- the sync cycle ---------- */
  async sync(mode = 'manual') {
    if (!this.connected()) { if (mode === 'manual') toast('Add your Web App URL first', { tone: 'error' }); return; }
    if (this.busy) return;
    if (!navigator.onLine) {
      this.status = 'error'; this.message = 'Offline — queued changes will go up when you reconnect';
      this.paint();
      if (mode === 'manual') toast(this.message, { tone: 'error' });
      return;
    }
    this.busy = true;
    this.status = 'syncing'; this.message = 'Syncing with Google Sheets…';
    this.paint();
    try {
      const hasWrites = this.pendingCount() > 0;
      const brain = typeof DB !== 'undefined' ? DB : null;
      let out;

      if (hasWrites || mode === 'manual' || mode === 'startup') {
        // one round trip: apply queued writes, store the brain, read everything back
        // Take the outbox *before* the request, so anything changed while it is in
        // flight is kept for the next push instead of being wiped when it returns.
        const sent = this.out;
        this.out = { newFuel: [], newService: [], newExpenses: [], edits: [], deletes: [], cardStatus: [] };
        try {
          out = await this.call('push', { data: { ...sent, brain } });
        } catch (err) {
          Object.keys(sent).forEach(k => { this.out[k] = [...(sent[k] || []), ...(this.out[k] || [])]; });
          this.saveCache();
          throw err;
        }
      } else {
        // cheap probe first — only pull when a sheet actually changed
        const s = await this.call('stamp', {}, 'GET');
        const changed = s.stamp.car !== this.stamp.car || s.stamp.expenses !== this.stamp.expenses;
        if (!changed) {
          this.cfg.lastSync = Date.now(); this.save();
          this.status = 'idle'; this.message = 'Up to date'; this.paint();
          this.busy = false;
          return;
        }
        out = await this.call('pull', {}, 'GET');
      }

      if (out.stamp) this.stamp = out.stamp;
      const d = out.data || {};
      const before = JSON.stringify([this.data.fuel, this.data.service, this.data.expenses, this.data.cards]);
      this.data = { fuel: d.fuel || [], service: d.service || [], expenses: d.expenses || [], cards: d.cards || [], meta: d.meta || null };
      reapplyCardStatus();
      const sheetChanged = JSON.stringify([this.data.fuel, this.data.service, this.data.expenses, this.data.cards]) !== before;

      // merge the Second Brain database using the same engine the gist sync uses
      let brainChanged = false;
      if (d.brain && typeof mergeDB === 'function') {
        const remote = normalizeDB(d.brain);
        const merged = mergeDB(DB, remote);
        if (canonDB(merged) !== canonDB(DB)) {
          this.applying = true;
          DB = merged;
          try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
          this.applying = false;
          brainChanged = true;
        }
      }

      this.saveCache();
      this.cfg.lastSync = Date.now(); this.save();
      this.status = 'idle'; this.message = 'Synced ' + new Date().toLocaleTimeString();
      if (sheetChanged || brainChanged) { try { render(); } catch (e) { /* view not ready */ } }
      if (mode === 'manual') toast('Google Sheets synced');
      else if (sheetChanged && mode !== 'startup') toast('Updated from Google Sheets');
      if (this.pendingCount()) this.queue(true);   // changes made while that request was in flight
    } catch (err) {
      this.status = 'error';
      this.message = err.message || 'Sync failed';
      if (mode !== 'auto') toast(this.message, { tone: 'error' });
    } finally {
      this.busy = false;
      this.paint();
    }
  },

  init() {
    this.load();
    this.paint();
    if (!this.connected()) return;
    this.status = 'idle';
    setTimeout(() => this.sync('startup'), 900);
    clearInterval(this.poll);
    this.poll = setInterval(() => {
      if (this.cfg.auto && !document.hidden && this.connected()) this.sync('auto');
    }, POLL_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && this.connected() && Date.now() - this.cfg.lastSync > 5000) this.sync('auto');
    });
    window.addEventListener('online', () => { if (this.connected()) this.sync('auto'); });
  },

  label() {
    if (!this.connected()) return 'Sheets off';
    if (this.status === 'syncing') return 'Syncing…';
    if (this.status === 'error') return 'Sheets issue';
    const p = this.pendingCount();
    if (p) return p + ' queued';
    return this.cfg.lastSync ? 'Sheets ' + relTime(this.cfg.lastSync) : 'Connected';
  },
  paint() {
    document.querySelectorAll('[data-sheets-status]').forEach(el => {
      el.dataset.state = this.connected() ? this.status : 'off';
      const t = el.querySelector('[data-sheets-text]');
      (t || el).textContent = this.label();
      el.title = this.message;
    });
  },

  /* ---------- setup panel ---------- */
  openPanel() {
    this.load();
    const on = this.connected();
    const m = openModal(`
      <div class="modal-head">
        <div><div class="eyebrow">Car &amp; expenses</div><h3>Google Sheets sync</h3></div>
        <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button>
      </div>
      <div class="modal-body">
        <div class="sync-state" data-sheets-status><span class="sync-dot"></span><b data-sheets-text>${esc(this.label())}</b></div>
        <p class="hint" style="margin-top:8px">${esc(this.message)}</p>
        ${this.data.meta ? `<p class="hint">Reading <b>${esc(this.data.meta.carSheet)}</b> and every month tab of <b>${esc(this.data.meta.expensesSheet)}</b> (${plural((this.data.meta.tabs || []).length, 'tab')}; new rows go to <b>${esc(this.data.meta.expensesTab)}</b>).</p>` : ''}
        <div class="set-section"><h4>Connection</h4>
          <p>Paste the <b>/exec</b> URL from your Apps Script deployment, and the same secret you set inside the script.</p>
          <div class="form-grid">
            <div class="field full"><label for="shUrl">Web App URL</label><input class="input" id="shUrl" value="${esc(this.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></div>
            <div class="field full"><label for="shSecret">Shared secret</label><input class="input" id="shSecret" type="password" value="${esc(this.cfg.secret)}" placeholder="the SECRET from Code.gs" autocomplete="off" spellcheck="false"></div>
            <div class="field full"><label class="toggle"><input type="checkbox" id="shAuto"${this.cfg.auto ? ' checked' : ''}><span></span>Keep in sync automatically</label></div>
          </div>
          <div class="btn-row" style="margin-top:12px">
            <button class="btn btn-primary" id="shSave">${icon('check', 15)} Save &amp; test</button>
            ${on ? `<button class="btn btn-ghost" id="shSync">${icon('sparkle', 15)} Sync now</button>
            <button class="btn btn-ghost" id="shCode">${icon('upload', 15)} Copy setup code</button>
            <button class="btn btn-danger" id="shOff">${icon('x', 15)} Disconnect</button>` : ''}
          </div>
        </div>
        <div class="set-section"><h4>Setting it up</h4>
          <p>1 · Open <b>script.google.com</b> → New project, and paste in the <b>Code.gs</b> file from the repo.<br>
             2 · Set your own <b>SECRET</b> at the top of that file.<br>
             3 · Deploy → New deployment → <b>Web app</b>, run as <b>Me</b>, access <b>Anyone</b>.<br>
             4 · Copy the /exec URL here, along with the secret.</p>
          <p>Changes you make in the sheets appear here within about 15 seconds; changes you make here are written to the sheets straight away.</p>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" data-close>Close</button></div>`, true);

    const v = id => { const el = m.querySelector('#' + id); return el ? el.value.trim() : ''; };
    m.querySelector('#shSave').onclick = async () => {
      const btn = m.querySelector('#shSave');
      this.cfg.url = v('shUrl').replace(/\/+$/, '');
      this.cfg.secret = v('shSecret');
      this.cfg.auto = m.querySelector('#shAuto').checked;
      if (!this.cfg.url) { toast('Paste the Web App URL first', { tone: 'error' }); return; }
      btn.disabled = true; btn.innerHTML = 'Testing…';
      try {
        await this.call('ping', {}, 'GET');
        this.save();
        this.status = 'idle';
        closeModal();
        toast('Connected to Google Sheets');
        this.init();
        this.sync('manual');
      } catch (err) {
        btn.disabled = false; btn.innerHTML = 'Save &amp; test';
        toast(err.message, { tone: 'error' });
      }
    };
    if (on) {
      m.querySelector('#shSync').onclick = () => this.sync('manual');
      m.querySelector('#shCode').onclick = async () => {
        const code = btoa(JSON.stringify({ u: this.cfg.url, s: this.cfg.secret }));
        try { await navigator.clipboard.writeText(code); toast('Setup code copied'); }
        catch (e) { prompt('Copy this setup code', code); }
      };
      m.querySelector('#shOff').onclick = () => {
        this.cfg.url = ''; this.cfg.secret = ''; this.save();
        this.status = 'off'; this.message = 'Not connected';
        clearInterval(this.poll);
        closeModal(); this.paint(); render();
        toast('Google Sheets disconnected');
      };
    }
  },
  applyCode(code) {
    const o = JSON.parse(atob(String(code).trim()));
    if (!o.u) throw new Error('bad code');
    this.cfg.url = o.u; this.cfg.secret = o.s || '';
    this.save();
  }
};

/* ---------- derived helpers used by the Car Maintenance screens ---------- */
const fuelRows = () => [...(Sheets.data.fuel || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
const serviceRows = () => [...(Sheets.data.service || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));
const sheetExpenses = () => [...(Sheets.data.expenses || [])].sort((a, b) => String(b.date).localeCompare(String(a.date)));

/** Fuel economy and spend, derived from consecutive odometer readings. */
function fuelStats() {
  const rows = [...(Sheets.data.fuel || [])]
    .filter(r => r.odometer > 0)
    .sort((a, b) => a.odometer - b.odometer);
  const total = sum(Sheets.data.fuel || [], r => r.cost);
  if (rows.length < 2) return { total, fills: (Sheets.data.fuel || []).length, km: 0, perKm: 0, avgFill: 0, avgDays: 0, last: rows[rows.length - 1] || null };
  const km = rows[rows.length - 1].odometer - rows[0].odometer;
  const spentBetween = sum(rows.slice(1), r => r.cost);
  const days = [];
  for (let i = 1; i < rows.length; i++) {
    if (rows[i].date && rows[i - 1].date) {
      const d = (parseDate(rows[i].date) - parseDate(rows[i - 1].date)) / 86400000;
      if (d > 0 && d < 120) days.push(d);
    }
  }
  return {
    total,
    fills: (Sheets.data.fuel || []).length,
    km,
    perKm: km ? spentBetween / km : 0,
    avgFill: total / Math.max(1, (Sheets.data.fuel || []).length),
    avgDays: days.length ? days.reduce((a, b) => a + b, 0) / days.length : 0,
    last: rows[rows.length - 1]
  };
}

/* =========================================================
   FORMS FOR SHEET-BACKED ROWS
   These records live in Google Sheets rather than in localStorage, so they
   use their own add/edit sheet instead of the generic openForm().
   ========================================================= */
const SHEET_FORMS = {
  fuel: {
    noun: 'Fuel fill-up', kind: 'fuel',
    fields: [
      { k: 'date', l: 'Date', t: 'date', req: true, def: () => today() },
      { k: 'cost', l: 'Cost (AED)', t: 'number', req: true, step: '0.01', min: 0, ph: '150' },
      { k: 'odometer', l: 'Odometer (km)', t: 'number', req: true, step: '1', min: 0, ph: '229330' }
    ]
  },
  service: {
    noun: 'Service record', kind: 'service',
    fields: [
      { k: 'item', l: 'What was done', t: 'text', req: true, full: true, ph: 'Oil and filter' },
      { k: 'cost', l: 'Cost (AED)', t: 'number', req: true, step: '0.01', min: 0 },
      { k: 'date', l: 'Date', t: 'date', req: true, def: () => today() },
      { k: 'odometer', l: 'Odometer (km)', t: 'number', step: '1', min: 0 }
    ]
  },
  expense: {
    noun: 'Expense', kind: 'expense',
    fields: [
      { k: 'name', l: 'Expense name', t: 'text', req: true, full: true, ph: 'Groceries' },
      { k: 'amount', l: 'Amount', t: 'number', req: true, step: '0.01', min: 0 },
      { k: 'currency', l: 'Currency', t: 'select', o: () => currencyChoices(), def: () => baseCur(), addOnly: true },
      { k: 'category', l: 'Category', t: 'text', ph: 'Essentials' },
      { k: 'method', l: 'Payment method', t: 'text', ph: 'ADCB' },
      { k: 'date', l: 'Date', t: 'date', req: true, def: () => today() }
    ]
  }
};

/** Add or edit a row that lives in Google Sheets. */
function openSheetForm(kind, item = null) {
  const base = SHEET_FORMS[kind];
  // "addOnly" fields (currency) make no sense when editing — the row's tab already fixes it
  const cfg = { ...base, fields: base.fields.filter(f => !(f.addOnly && item)) };
  if (!Sheets.connected()) {
    toast('Connect Google Sheets first', { tone: 'error' });
    Sheets.openPanel();
    return;
  }
  const vals = {};
  cfg.fields.forEach(f => {
    vals[f.k] = item ? item[f.k] : ((typeof f.def === 'function' ? f.def() : f.def) ?? '');
  });
  const canDelete = item && item.row && !item.pending;
  const m = openModal(`
    <div class="modal-head">
      <div><div class="eyebrow">${item ? 'Edit' : 'New'} · Google Sheets</div><h3>${item ? esc(item[cfg.fields[0].k] || cfg.noun) : cfg.noun}</h3></div>
      <button class="icon-btn" data-close aria-label="Close">${icon('x')}</button>
    </div>
    <form class="modal-body" novalidate autocomplete="off">
      <div class="form-grid">${cfg.fields.map(f => fieldHTML(f, vals)).join('')}</div>
      <p class="hint" style="margin-top:12px" data-hint>${sheetFormHint(kind, item, vals)}</p>
    </form>
    <div class="modal-foot">
      ${canDelete ? `<button class="btn btn-danger" data-del>${icon('trash', 15)} <span>Delete</span></button>` : ''}
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-save>${icon('check', 15)} ${item ? 'Save to sheet' : 'Add to sheet'}</button>
    </div>`, cfg.wide);

  const form = $('form', m);
  const refreshHint = () => {
    const h = $('[data-hint]', m);
    if (h) h.innerHTML = sheetFormHint(kind, item, readForm(form, cfg));
  };
  form.addEventListener('input', e => { e.target.closest('.field')?.classList.remove('invalid'); refreshHint(); });
  form.addEventListener('change', refreshHint);

  const submit = () => {
    const data = readForm(form, cfg);
    $$('.field', form).forEach(el => el.classList.remove('invalid'));
    const missing = cfg.fields.filter(f => f.req && (data[f.k] === '' || data[f.k] == null));
    if (missing.length) {
      missing.forEach(f => $(`.field[data-k="${f.k}"]`, form).classList.add('invalid'));
      toast('Please fill in the required fields', { tone: 'error' });
      return;
    }
    if (item && item.row && !item.pending) {
      Sheets.editRow(kind, item.row, data, item.tab || '');
      toast(`${cfg.noun} updated — saving to your sheet`);
    } else {
      Sheets.addRow(kind, data);
      toast(`${cfg.noun} added — saving to your sheet`);
    }
    closeModal();
    render();
  };
  $('[data-save]', m).onclick = submit;
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
  });
  if (canDelete) {
    $('[data-del]', m).onclick = () => {
      Sheets.removeRow(kind, item.row, item.tab || '');
      closeModal(); render();
      toast(`${cfg.noun} deleted from your sheet`);
    };
  }
}

/* =========================================================
   UNIFIED EXPENSES
   When Google Sheets is connected the sheet is the source of truth, so a row
   added in the app and a row typed into the sheet are the same thing.
   Falls back to the app's own transactions when Sheets is not connected.
   ========================================================= */
const usingSheets = () => Sheets.connected() && (Sheets.data.expenses || []).length > 0;
/** Currency the finance figures are shown in (the sheets hold AED and EGP). */
const baseCur = () => {
  if (!usingSheets()) return DB.settings.currency || '$';
  const avail = currenciesAvailable();
  if (UI.finCurrency && avail.indexOf(UI.finCurrency) !== -1) return UI.finCurrency;
  return avail.indexOf('AED') !== -1 ? 'AED' : (avail[0] || 'AED');
};

function expenseUniverse() {
  if (usingSheets()) {
    const rows = (Sheets.data.expenses || []).map(r => ({
      id: r.id, row: r.row, tab: r.tab, pending: r.pending, approxDate: r.approxDate,
      month: r.month || String(r.date || '').slice(0, 7),
      date: r.date, description: r.name, amount: num(r.amount),
      category: r.category || 'Uncategorised', account: r.method || '',
      currency: r.currency || 'AED', type: 'Expense', source: 'sheet'
    }));
    // Your sheets hold expenses only, so income stays app-side and joins the same view.
    const income = (DB.transactions || []).filter(x => x.type === 'Income').map(x => ({
      id: x.id, date: x.date, month: String(x.date || '').slice(0, 7),
      description: x.description, amount: num(x.amount),
      category: x.category, account: x.account,
      currency: x.currency || 'AED', type: 'Income', source: 'local'
    }));
    return rows.concat(income);
  }
  return (DB.transactions || []).map(x => ({
    id: x.id, date: x.date, month: String(x.date || '').slice(0, 7),
    description: x.description, amount: num(x.amount),
    category: x.category, account: x.account, currency: DB.settings.currency || '$',
    type: x.type, source: 'local'
  }));
}

/** All currencies present, so the picker only offers what actually exists. */
const currenciesAvailable = () => [...new Set(expenseUniverse().map(x => x.currency))].filter(Boolean).sort();

const endOfMonth = m => {
  const [y, mo] = m.split('-').map(Number);
  return `${m}-${pad(new Date(y, mo, 0).getDate())}`;
};

/** [from, to] for the active date filter. */
function rangeBounds() {
  const m = UI.finMonth;
  switch (UI.finRange || 'month') {
    case 'prev': { const p = shiftMonth(m, -1); return [p + '-01', endOfMonth(p)]; }
    case '3m': return [shiftMonth(m, -2) + '-01', endOfMonth(m)];
    case '6m': return [shiftMonth(m, -5) + '-01', endOfMonth(m)];
    case 'year': return [m.slice(0, 4) + '-01-01', m.slice(0, 4) + '-12-31'];
    case 'all': return ['0000-01-01', '9999-12-31'];
    case 'custom': return [UI.finFrom || '0000-01-01', UI.finTo || '9999-12-31'];
    default: return [m + '-01', endOfMonth(m)];
  }
}
const rangeLabel = () => ({
  month: monthLabel(UI.finMonth, true),
  prev: monthLabel(shiftMonth(UI.finMonth, -1), true),
  '3m': `${monthLabel(shiftMonth(UI.finMonth, -2))} – ${monthLabel(UI.finMonth, true)}`,
  '6m': `${monthLabel(shiftMonth(UI.finMonth, -5))} – ${monthLabel(UI.finMonth, true)}`,
  year: UI.finMonth.slice(0, 4),
  all: 'All time',
  custom: `${UI.finFrom ? fmtDate(UI.finFrom) : 'start'} – ${UI.finTo ? fmtDate(UI.finTo) : 'now'}`
}[UI.finRange || 'month']);

/** Expenses inside the active date range and currency. */
function filteredExpenses() {
  const [from, to] = rangeBounds();
  const cur = baseCur();
  return expenseUniverse()
    .filter(x => x.date && x.date >= from && x.date <= to)
    .filter(x => !usingSheets() || x.currency === cur)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

/** Months that actually contain data, newest first — drives the month picker. */
function monthsWithData() {
  const set = new Set(expenseUniverse().filter(x => x.date).map(x => x.date.slice(0, 7)));
  set.add(today().slice(0, 7));   // the current month is always selectable
  return [...set].sort().reverse();
}

/** The sheet tab a row of this month + currency belongs to, or null if none exists yet. */
function sheetTabFor(dateStr, currency) {
  const tabs = (Sheets.data.meta && Sheets.data.meta.tabs) || [];
  const m = String(dateStr || today()).slice(0, 7);
  const cur = currency || 'AED';
  return tabs.find(t => t.month === m && (t.currency || 'AED') === cur) || null;
}

/** Currencies offered when adding — whatever exists, plus the two the sheets use. */
function currencyChoices() {
  return [...new Set([...currenciesAvailable(), 'AED', 'EGP'])].filter(Boolean);
}

/** Tells you where a row will be written before you press save. */
function sheetFormHint(kind, item, vals) {
  if (kind !== 'expense') {
    return item ? `Saves to row ${item.row || '—'} of your sheet.` : 'Appended to the bottom of the table in your sheet.';
  }
  if (item && item.row && !item.pending) {
    return `Saves to row ${item.row} of <b>${esc(item.tab || 'your sheet')}</b>.`;
  }
  const cur = vals.currency || baseCur();
  const hit = sheetTabFor(vals.date, cur);
  const label = monthLabel(String(vals.date || today()).slice(0, 7), true);
  return hit
    ? `Appended to <b>${esc(hit.name)}</b> in your Expenses sheet.`
    : `No ${esc(cur)} tab for ${esc(label)} yet — one will be created from your newest tab's layout.`;
}

/* =========================================================
   CREDIT CARDS — one sheet tab per card, charges summing to the debt.
   Card charges are deliberately NOT expenses: the payment is what gets
   copied into a month tab, so counting both would double up.
   ========================================================= */
const cardList = () => (Sheets.data.cards || []).filter(c => c && c.name);
const cardDebtTotal = cur => sum(cardList().filter(c => (c.currency || 'AED') === (cur || 'AED')), c => c.debt);
const cardCurrencies = () => [...new Set(cardList().map(c => c.currency || 'AED'))];
const curMoney = (v, cur) => (cur || 'AED') + ' ' + num(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* =========================================================
   CREDIT-CARD SWITCHER — one card in focus, flip between them
   ========================================================= */
const CARD_PREF = 'secondBrain.finCard';
const sortedCards = () => [...cardList()].sort((a, b) => num(b.debt) - num(a.debt) || String(a.name).localeCompare(String(b.name)));
/** The card in focus ('' = All cards). Restored lazily so it works before UI exists. */
function selectedCardName() {
  if (UI.finCard === undefined) {
    try { UI.finCard = localStorage.getItem(CARD_PREF) || ''; } catch (e) { UI.finCard = ''; }
  }
  return sortedCards().some(c => c.name === UI.finCard) ? UI.finCard : '';
}
function pickCard(name) {
  UI.finCard = name || '';
  try { localStorage.setItem(CARD_PREF, UI.finCard); } catch (e) { /* ignore */ }
  render();
  // keep the chosen tile in view without jolting the page vertically
  requestAnimationFrame(() => {
    const tile = document.querySelector('.cc-tile.on');
    if (tile && tile.parentElement) tile.parentElement.scrollTo({ left: Math.max(0, tile.offsetLeft - 16), behavior: 'smooth' });
  });
}
function cycleCard(dir) {
  const names = ['', ...sortedCards().map(c => c.name)];
  const i = names.indexOf(selectedCardName());
  pickCard(names[(i + dir + names.length) % names.length]);
}
/** A steady colour per card, kept inside the app's blue family. */
function cardGradient(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 997;
  const hue = 196 + (h % 52);
  return `linear-gradient(135deg, hsl(${hue} 88% 44%) 0%, hsl(${hue + 18} 78% 26%) 62%, hsl(${hue + 30} 70% 16%) 100%)`;
}
/** Share of the (owed + available) line in use, or null when the tab has no figure. */
function cardUsage(c) {
  if (c.available === null || c.available === undefined) return null;
  const line = num(c.debt) + num(c.available);
  return line > 0 ? Math.min(100, num(c.debt) / line * 100) : 0;
}
function cardCategories(c) {
  const cats = {};
  (c.rows || []).filter(r => !r.paid).forEach(r => { const k = r.category || 'Uncategorised'; cats[k] = (cats[k] || 0) + num(r.amount); });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]);
}
function cardRail(cards, selected) {
  const allOwed = cardCurrencies().map(cur => curMoney(cardDebtTotal(cur), cur)).join(' · ');
  return `<div class="cc-rail" role="tablist" aria-label="Credit cards">
    <button class="cc-tile cc-all${!selected ? ' on' : ''}" role="tab" aria-selected="${!selected}" data-act="pickCard" data-val="">
      <span class="cc-top"><span class="cc-name">All cards</span>${icon('layers', 17)}</span>
      <span class="cc-owed">${allOwed}</span>
      <span class="cc-sub">${plural(cards.length, 'card')} · ${sum(cards, c => c.unpaid)} open</span>
    </button>
    ${cards.map(c => `<button class="cc-tile${selected === c.name ? ' on' : ''}" role="tab" aria-selected="${selected === c.name}" data-act="pickCard" data-val="${esc(c.name)}" style="--cc:${cardGradient(c.name)}">
      <span class="cc-top"><span class="cc-name">${esc(c.name)}</span><span class="cc-chip"></span></span>
      <span class="cc-owed">${curMoney(c.debt, c.currency)}</span>
      <span class="cc-sub">${plural(c.unpaid, 'open charge')}${c.available !== null && c.available !== undefined ? ` · ${curMoney(c.available, c.currency)} free` : ''}</span>
    </button>`).join('')}
  </div>`;
}

/* ---------- paying off card charges ---------- */
/** Marks a charge paid/unpaid on screen at once, then queues the write to the sheet. */
function setCardPaid(cardName, row, paid, quiet) {
  const card = cardList().find(c => c.name === cardName);
  const r = card && (card.rows || []).find(x => x.row === row);
  if (!r) return false;
  r.paid = !!paid;
  r.pending = true;
  card.debt = Math.round(sum(card.rows.filter(x => !x.paid), x => x.amount) * 100) / 100;
  card.unpaid = card.rows.filter(x => !x.paid).length;
  const box = Sheets.out.cardStatus || (Sheets.out.cardStatus = []);
  const i = box.findIndex(s => s.card === cardName && s.row === row);
  if (i >= 0) box.splice(i, 1);                     // latest tap wins; nothing piles up
  box.push({ card: cardName, row, name: r.name, amount: r.amount, paid: !!paid });
  Sheets.saveCache();
  if (!quiet) Sheets.queue(true);
  return true;
}
/** Fresh data from the sheet must not undo a tap that has not been sent yet. */
function reapplyCardStatus() {
  (Sheets.out.cardStatus || []).forEach(s => {
    const card = cardList().find(c => c.name === s.card);
    const r = card && (card.rows || []).find(x => x.row === s.row && x.name === s.name);
    if (!r) return;
    r.paid = s.paid; r.pending = true;
    card.debt = Math.round(sum(card.rows.filter(x => !x.paid), x => x.amount) * 100) / 100;
    card.unpaid = card.rows.filter(x => !x.paid).length;
  });
}
/** Why a card can't be toggled, or '' when it can. */
function cardStatusBlocker(card) {
  if (!card) return 'Card not found';
  if (card.statusCol === undefined) return 'Update the Apps Script to save payment status — see the note on the Cards page';
  if (card.statusCol === false) return `“${card.name}” has no Payment Status column — add one to its tab to track payments`;
  return '';
}
function toggleCardPaid(cardName, row) {
  const card = cardList().find(c => c.name === cardName);
  const why = cardStatusBlocker(card);
  if (why) { toast(why, { tone: 'error' }); return; }
  const r = (card.rows || []).find(x => x.row === row);
  if (!r) return;
  const paid = !r.paid;
  setCardPaid(cardName, row, paid);
  render();
  toast(`${r.name} marked ${paid ? 'paid' : 'unpaid'}`, {
    action: 'Undo', onAction: () => { setCardPaid(cardName, row, !paid); render(); }
  });
}
function markCardAllPaid(cardName) {
  const card = cardList().find(c => c.name === cardName);
  const why = cardStatusBlocker(card);
  if (why) { toast(why, { tone: 'error' }); return; }
  const open = (card.rows || []).filter(x => !x.paid);
  if (!open.length) { toast('Nothing open on this card'); return; }
  open.forEach(r => setCardPaid(cardName, r.row, true, true));
  Sheets.queue(true);
  render();
  toast(`${plural(open.length, 'charge')} marked paid on ${cardName}`, {
    action: 'Undo', onAction: () => { open.forEach(r => setCardPaid(cardName, r.row, false, true)); Sheets.queue(true); render(); }
  });
}
const payPill = (card, r) => `<button class="pay-pill${r.paid ? ' on' : ''}${r.pending ? ' busy' : ''}" data-act="toggleCardPaid" data-card="${esc(card.name)}" data-row="${r.row}"${card.statusCol === false ? ' disabled' : ''} title="${r.paid ? 'Paid — tap to mark unpaid' : 'Unpaid — tap to mark paid'}">${r.paid ? 'Paid' : 'Unpaid'}</button>`;

// swipe the focused card left/right on touch screens
(function () {
  let sx = 0, sy = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    tracking = !!(e.target.closest && e.target.closest('.cc-detail'));
    if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 45) cycleCard(dx < 0 ? 1 : -1);
  }, { passive: true });
})();


/* =========================================================
   SORTING & GROUPING for the transactions list
   ========================================================= */
function sortTx(list) {
  const copy = [...list];
  switch (UI.txSort || 'date') {
    case 'amount': return copy.sort((a, b) => num(b.amount) - num(a.amount));
    case 'oldest': return copy.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    case 'category': return copy.sort((a, b) =>
      String(a.category || 'Uncategorised').localeCompare(String(b.category || 'Uncategorised')) ||
      num(b.amount) - num(a.amount));
    default: return copy.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }
}
const groupedByCategory = () => (UI.txSort || 'date') === 'category';

/** [category, rows, spend] biggest spend first; income is excluded from the spend. */
function byCategory(list) {
  const map = new Map();
  list.forEach(x => {
    const k = x.category || 'Uncategorised';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(x);
  });
  return [...map.entries()]
    .map(([k, rows]) => [k, rows, sum(rows.filter(r => r.type !== 'Income'), r => r.amount)])
    .sort((a, b) => b[2] - a[2]);
}

const TX_SORTS = [['date', 'Newest first'], ['oldest', 'Oldest first'], ['amount', 'Largest amount'], ['category', 'Category (grouped)']];
/** One transaction row; grouping inserts category headings between them. */
function txRow(x) {
  return `<tr data-act="${x.source === 'sheet' ? 'sheetEdit' : 'edit'}" data-kind="expense" data-type="transactions" data-id="${esc(x.id)}">
      <td class="mono muted">${esc(x.date ? fmtDate(x.date, { day: 'numeric', month: 'short', year: '2-digit' }) : '—')}</td>
      <td><div class="tx-desc"><span class="tx-ico ${x.type}">${icon(x.type === 'Income' ? 'arrowDown' : 'arrowUp', 15)}</span>${esc(x.description)}${x.pending ? ' <span class="chip amber">saving</span>' : ''}</div></td>
      <td>${x.category ? `<span class="chip ${x.type === 'Income' ? 'blue' : ''}">${esc(x.category)}</span>` : ''}</td>
      <td class="muted">${esc(x.account || '')}${x.tab ? ` <span class="hint">· ${esc(x.tab)}</span>` : ''}</td>
      <td class="r amt ${x.type}">${x.type === 'Income' ? '+' : '−'}${money(num(x.amount), 2)}</td>
      <td class="r" style="width:44px"><div class="hover-actions"><button class="icon-btn" data-act="${x.source === 'sheet' ? 'sheetEdit' : 'edit'}" data-kind="expense" data-type="transactions" data-id="${esc(x.id)}" aria-label="Edit">${icon('edit', 15)}</button></div></td>
    </tr>`;
}

/** Sorted rows, with a subtotal heading per category when grouping is on. */
function txRows(list) {
  if (!groupedByCategory()) return list.map(txRow).join('');
  const total = sum(list.filter(x => x.type !== 'Income'), x => x.amount) || 1;
  return byCategory(list).map(([cat, rows, spend]) =>
    `<tr class="grp"><td colspan="6"><span>${esc(cat)}</span><b>${money(spend)} · ${Math.round(spend / total * 100)}% · ${plural(rows.length, 'row')}</b></td></tr>`
    + rows.map(txRow).join('')
  ).join('');
}


/** Spending by category for whatever range is on screen. */
function categoryChart(list) {
  const groups = byCategory(list.filter(x => x.type !== 'Income')).filter(g => g[2] > 0);
  if (!groups.length) return '';
  const total = sum(groups, g => g[2]);
  const shown = groups.slice(0, 9);
  const rest = groups.slice(9);
  if (rest.length) shown.push([`${rest.length} more categories`, [], sum(rest, g => g[2])]);
  const top = shown[0][2] || 1;
  return `<div class="card" style="margin-bottom:16px">
    ${cardHead('pie', `Spending by category · ${esc(rangeLabel())}`, `<span class="hint">${money(total)}</span>`)}
    ${shown.map(([name, , amt], i) => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:6px"><span>${esc(name)}</span><span class="mono hint">${money(amt)} · ${Math.round(amt / total * 100)}%</span></div>
      <div class="bar"><i style="width:${Math.max(2, amt / top * 100)}%;background:${CAT_COLORS[i % CAT_COLORS.length]};box-shadow:none"></i></div>
    </div>`).join('')}
  </div>`;
}

/* =========================================================
   17b. CAR MAINTENANCE — data lives in the "Hyundai Elantra" Google Sheet
   ========================================================= */
const sheetOffState = (what) => `<div class="card">${emptyState('sheet', 'Google Sheets not connected',
  `Connect your sheet and ${what} appears here — and anything you add is written straight back to the sheet.`,
  `<button class="btn btn-primary" data-act="sheetsPanel">${icon('cloud', 15)} Connect Google Sheets</button>`)}</div>`;

/** Fuel rows enriched with distance and days since the previous fill. */
function fuelWithDeltas() {
  const rows = [...(Sheets.data.fuel || [])].filter(r => !r.hidden);
  const byOdo = [...rows].filter(r => r.odometer > 0).sort((a, b) => a.odometer - b.odometer);
  const prev = new Map();
  byOdo.forEach((r, i) => { if (i) prev.set(r.id, byOdo[i - 1]); });
  return rows.sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.odometer - a.odometer)
    .map(r => {
      const p = prev.get(r.id);
      const km = p ? r.odometer - p.odometer : 0;
      const days = p && p.date && r.date ? Math.round((parseDate(r.date) - parseDate(p.date)) / 86400000) : 0;
      return { ...r, km, days, perKm: km ? r.cost / km : 0 };
    });
}

function carFuel() {

  </section>
  <div class="dash-grid">

      ${cardHead('trend', 'Recent fill-ups')}

        ${last12.map(r => `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px" title="${esc(fmtDate(r.date))} · ${aed(r.cost)}">
          <div style="width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#00B4FF,#0066FF);height:${Math.max(4, r.cost / max * 118)}px"></div>

      <div class="table-wrap"><table class="tbl">
        <thead><tr><th>Date</th><th class="r">Odometer</th><th class="r">Cost</th><th class="r">Distance</th><th class="r">Days</th><th></th></tr></thead>
        <tbody>${rows.map(r => `<tr data-act="sheetEdit" data-kind="fuel" data-id="${esc(r.id)}">
          <td>${esc(fmtDate(r.date, { day: 'numeric', month: 'short', year: 'numeric' }))}${r.pending ? ' <span class="chip amber">saving</span>' : ''}</td>
          <td class="r mono">${r.odometer ? r.odometer.toLocaleString() : '—'}</td>
          <td class="r mono">${aed(r.cost)}</td>
          <td class="r mono muted">${r.km ? r.km.toLocaleString() + ' km' : '—'}</td>
          <td class="r mono muted">${r.days || '—'}</td>
          <td class="r" style="width:44px"><div class="hover-actions"><button class="icon-btn" data-act="sheetEdit" data-kind="fuel" data-id="${esc(r.id)}" aria-label="Edit">${icon('edit', 15)}</button></div></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
  </div>`;
}

  return `
  <section class="stats stagger" style="margin-bottom:16px">
    ${stat('wallet', 'Total on service', aed(total), `${plural(rows.length, 'record')}`)}

  <div class="card table-card">
    ${cardHead('sheet', 'Service history', `<span class="hint" style="padding-right:16px">${esc(Sheets.data.meta ? Sheets.data.meta.carSheet : 'Google Sheet')}</span>`)}

        <td>${esc(fmtDate(r.date, { day: 'numeric', month: 'short', year: 'numeric' }))}</td>
        <td class="r mono muted">${r.odometer ? r.odometer.toLocaleString() : '—'}</td>
        <td class="r mono">${aed(r.cost)}</td>
        <td class="r" style="width:44px"><div class="hover-actions"><button class="icon-btn" data-act="sheetEdit" data-kind="service" data-id="${esc(r.id)}" aria-label="Edit">${icon('edit', 15)}</button></div></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}


/** Finances → Cards: one tab per credit card, its charges adding up to the debt. */
function finCards() {
  if (!Sheets.connected()) return sheetOffState('your credit cards');
  const cards = sortedCards();
  if (!cards.length) {
    return `<div class="card">${emptyState('wallet', 'No credit-card tabs found',
      'A tab counts as a card when it holds a charges table and has no month in its name — like “ADCB Visa”. It needs a name column and an amount column.',
      `<button class="btn btn-ghost" data-act="sheetSync">${icon('sparkle', 15)} Sync now</button>`)}</div>`;
  }
  const selected = selectedCardName();
  const card = cards.find(c => c.name === selected);
  const pos = card ? cards.indexOf(card) + 1 : 0;
  return `
  <div class="toolbar">
    <span class="hint">${card ? `Card ${pos} of ${cards.length}` : `${plural(cards.length, 'card')}`} · click a card or use <span class="kbd">←</span> <span class="kbd">→</span></span>
    <span class="spacer"></span>
    <button class="icon-btn" data-act="cycleCard" data-val="-1" title="Previous card (←)" aria-label="Previous card">${icon('chevL', 18)}</button>
    <button class="icon-btn" data-act="cycleCard" data-val="1" title="Next card (→)" aria-label="Next card">${icon('chevR', 18)}</button>
    <button class="btn btn-ghost" data-act="sheetSync">${icon('sparkle', 15)} Sync</button>
  </div>
  ${cardRail(cards, selected)}
  ${card ? cardDetailDesk(card) : cardsOverviewDesk(cards)}

/* =========================================================
   20. EVENT WIRING — delegation keeps re-renders cheap
   ========================================================= */
function wireView() {
  const view = $('#view');
  view.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !view.contains(el)) return;
    if (el.tagName === 'A') return; // let links open normally
    e.preventDefault();
    ACTIONS[el.dataset.act]?.(el, e);
  });
  // Keyboard activation for focusable cards
  view.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'captureInput') { e.preventDefault(); ACTIONS.capture(); return; }
    if (e.key === 'Enter' && e.target.id === 'qaTitle') { e.preventDefault(); ACTIONS.quickTask(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex="0"][data-act]')) { e.preventDefault(); ACTIONS[e.target.dataset.act]?.(e.target, e); }
  });
  view.addEventListener('change', e => {
    const key = e.target.dataset.bind;
    if (key && e.target.tagName === 'SELECT') { UI[key] = e.target.value; render(); }
  });
  // Live text filters: re-render but keep focus + caret
  view.addEventListener('input', e => {
    const key = e.target.dataset.bind;
    if (!key || e.target.tagName !== 'INPUT') return;
    UI[key] = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $(`[data-bind="${key}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) { /* search inputs */ } }
  });
  // Kanban drag & drop (projects board)
  view.addEventListener('dragstart', e => {
    const c = e.target.closest?.('[data-drag]'); if (!c) return;
    e.dataTransfer.setData('text/plain', c.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => c.classList.add('dragging'));
  });
  view.addEventListener('dragend', e => {
    e.target.closest?.('[data-drag]')?.classList.remove('dragging');
    $$('.col.drag-over').forEach(c => c.classList.remove('drag-over'));
  });
  view.addEventListener('dragover', e => {
    const col = e.target.closest('[data-drop]'); if (!col) return;
    e.preventDefault();
    $$('.col.drag-over').forEach(c => c !== col && c.classList.remove('drag-over'));
    col.classList.add('drag-over');
  });
  view.addEventListener('drop', e => {
    const col = e.target.closest('[data-drop]'); if (!col) return;
    e.preventDefault();
    const p = find('projects', e.dataTransfer.getData('text/plain'));
    if (p && p.status !== col.dataset.drop) {
      p.status = col.dataset.drop;
      if (p.status === 'Completed') p.progress = 100;
      p.updated = today();
      saveDB(); render();
      toast(`“${p.name}” moved to ${p.status}`);
    } else col.classList.remove('drag-over');
  });
}

/* =========================================================
   21. GLOBAL SEARCH
   ========================================================= */
let searchHits = [], searchSel = 0;
function snippet(text, q) {
  const s = String(text || '').replace(/[*#`]/g, '').replace(/\s+/g, ' ');
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return s.slice(0, 80);
  const start = Math.max(0, i - 30);
  return (start ? '…' : '') + s.slice(start, i + q.length + 50);
}
function searchAll(raw) {
  const q = raw.toLowerCase().trim(); if (!q) return [];
  const hit = (...f) => f.some(v => (Array.isArray(v) ? v.join(' ') : String(v ?? '')).toLowerCase().includes(q));
  const res = [];
  DB.projects.forEach(p => hit(p.name, p.description, p.area) && res.push({ type: 'projects', id: p.id, title: p.name, meta: `${p.status} · ${p.area}` }));
  DB.tasks.forEach(t => hit(t.title, t.notes) && res.push({ type: 'tasks', id: t.id, title: t.title, meta: `${t.status}${t.due ? ' · due ' + fmtDate(t.due) : ''}` }));
  DB.courses.forEach(c => hit(c.name, c.platform, c.instructor, c.notes, c.resources) && res.push({ type: 'courses', id: c.id, title: c.name, meta: `${c.status} · ${coursePct(c)}%` }));
  DB.notes.forEach(n => hit(n.title, n.content, n.tags, n.category) && res.push({ type: 'notes', id: n.id, title: n.title, meta: snippet(n.content, q) }));
  DB.journal.forEach(j => hit(j.title, j.content, j.tags) && res.push({ type: 'journal', id: j.id, title: j.title || fmtDate(j.date), meta: fmtDate(j.date) + ' · ' + snippet(j.content, q) }));
  DB.habits.forEach(h => hit(h.name, h.category, h.notes) && res.push({ type: 'habits', id: h.id, title: h.name, meta: `${h.category || 'Habit'} · ${plural(habitStreak(h.id), 'day')} streak` }));
  [...DB.study].sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(x => hit(x.subject, x.topic, x.kind) && res.push({ type: 'study', id: x.id, title: x.subject || 'Study session', meta: `${fmtDate(x.date)} · ${dur(x.minutes)}${x.topic ? ' · ' + snippet(x.topic, q) : ''}` }));
  [...DB.workouts].sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(x => hit(x.focus, x.type, x.notes) && res.push({ type: 'workouts', id: x.id, title: x.focus || x.type || 'Workout', meta: `${fmtDate(x.date)} · ${x.type} · ${dur(x.minutes)}` }));
  DB.goals.forEach(g => hit(g.name) && res.push({ type: 'goals', id: g.id, title: g.name, meta: `${money(num(g.saved))} of ${money(num(g.target))}` }));
  DB.budgets.forEach(b => hit(b.category, 'budget') && res.push({ type: 'budgets', id: b.id, title: b.category + ' budget', meta: `${money(num(b.limit))} / month` }));
  [...DB.transactions].sort((a, b) => b.date.localeCompare(a.date)).forEach(x => hit(x.description, x.category) && res.push({ type: 'transactions', id: x.id, title: x.description, meta: `${x.type} · ${money(num(x.amount), 2)} · ${fmtDate(x.date)}` }));
  return res.slice(0, 40);
}
function renderSearch() {
  const q = $('#searchInput').value, box = $('#searchResults');
  searchHits = searchAll(q);
  if (!q.trim()) { box.classList.remove('open'); return; }
  searchSel = Math.min(searchSel, Math.max(0, searchHits.length - 1));
  let html = '', group = '';
  searchHits.forEach((r, i) => {
    if (r.type !== group) { group = r.type; html += `<div class="sr-group">${TYPE_META[r.type].label}</div>`; }
    html += `<button class="sr-item${i === searchSel ? ' sel' : ''}" data-i="${i}" role="option"><span class="sr-ico">${icon(TYPE_META[r.type].icon, 15)}</span><div><div class="sr-title">${highlight(r.title, q.trim())}</div><div class="sr-meta">${esc(r.meta)}</div></div></button>`;
  });
  box.innerHTML = html || `<div class="empty sm"><div class="e-ico">${icon('search', 20)}</div><h4>No results</h4><p>Nothing matches “${esc(q)}”.</p></div>`;
  box.classList.add('open');
  $('.sr-item.sel', box)?.scrollIntoView({ block: 'nearest' });
}
function openSearchHit(r) {
  if (!r) return;
  $('#searchInput').value = ''; $('#searchResults').classList.remove('open'); $('#searchInput').blur();
  const meta = TYPE_META[r.type];
  if (r.type === 'journal') { UI.journalSel = r.id; UI.journalQuery = ''; go('journal'); return; }
  if (meta.tab) UI.finTab = meta.tab;
  if (r.type === 'transactions') { const x = find('transactions', r.id); if (x) { UI.finMonth = x.date.slice(0, 7); UI.txType = ''; UI.txCat = ''; UI.txAll = false; } }
  if (r.type === 'notes') { UI.noteCat = 'All'; UI.noteTag = ''; UI.noteQuery = ''; }
  go(meta.view);
  const it = find(r.type, r.id); if (it) openForm(r.type, it);
}
function wireSearch() {
  const input = $('#searchInput'), box = $('#searchResults');
  input.addEventListener('input', () => { searchSel = 0; renderSearch(); });
  input.addEventListener('focus', () => { if (input.value.trim()) renderSearch(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); searchSel = Math.min(searchHits.length - 1, searchSel + 1); renderSearch(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); searchSel = Math.max(0, searchSel - 1); renderSearch(); }
    else if (e.key === 'Enter') { e.preventDefault(); openSearchHit(searchHits[searchSel]); }
    else if (e.key === 'Escape') { input.value = ''; box.classList.remove('open'); input.blur(); }
  });
  box.addEventListener('mousedown', e => e.preventDefault()); // keep focus while clicking
  box.addEventListener('click', e => { const b = e.target.closest('.sr-item'); if (b) openSearchHit(searchHits[+b.dataset.i]); });
  document.addEventListener('click', e => { if (!e.target.closest('#search')) box.classList.remove('open'); });
}

/* =========================================================
   22. SETTINGS, BACKUP & RESTORE
   ========================================================= */
function openSettings() {
  let bytes = 0; try { bytes = new Blob([localStorage.getItem(STORE_KEY) || '']).size; } catch (e) { /* ignore */ }
  const total = Object.values(DB).filter(Array.isArray).reduce((s, a) => s + a.length, 0);
  const m = openModal(`
    <div class="modal-head"><div><div class="eyebrow">Preferences</div><h3>Settings &amp; Backup</h3></div><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label for="setName">Your name</label><input class="input" id="setName" value="${esc(DB.settings.name)}" placeholder="Used in the dashboard greeting"></div>
        <div class="field"><label for="setCur">Currency symbol</label><input class="input" id="setCur" list="curList" value="${esc(DB.settings.currency)}" maxlength="4"><datalist id="curList">${['$', '€', '£', '¥', '₹', 'E£', 'AED ', 'SAR ', 'CHF '].map(c => `<option value="${c}">`).join('')}</datalist></div>
        <div class="field"><label for="setStudy">Study target · hours a week</label><input class="input" id="setStudy" type="number" min="0" step="1" value="${studyWeeklyGoal()}"></div>
        <div class="field"><label for="setEx">Exercise target · workouts a week</label><input class="input" id="setEx" type="number" min="0" step="1" value="${exerciseWeeklyGoal()}"></div>
      </div>
      <div class="set-section"><h4>Backup &amp; restore</h4>
        <p>Everything lives in this browser’s localStorage — ${plural(total, 'item')}, ${(bytes / 1024).toFixed(1)} KB. Clearing browser data erases it, so export a backup regularly.</p>
        <div class="btn-row"><button class="btn btn-ghost" id="expJson">${icon('download', 15)} Export JSON backup</button>
          <label class="btn btn-ghost" tabindex="0">${icon('upload', 15)} Import backup<input type="file" id="impJson" accept=".json,application/json" style="display:none"></label></div>
      </div>
      <div class="set-section"><h4>Export for Excel</h4>
        <p>Each CSV uses the exact column order of the matching sheet in <b>Second Brain.xlsx</b> — paste rows straight into the white input columns.</p>
        <div class="btn-row">${Object.keys(EXPORTS).map(k => `<button class="btn btn-ghost sm" data-csv="${k}">${icon('download', 13)} ${k}</button>`).join('')}</div>
      </div>
      <div class="set-section"><h4>Data</h4>
        <p>Load the sample data to explore, or start with a clean slate.</p>
        <div class="btn-row"><button class="btn btn-ghost" id="loadDemo">${icon('sparkle', 15)} Load demo data</button><button class="btn btn-danger" id="eraseAll">${icon('trash', 15)} Erase all data</button></div>
      </div>
      <div class="set-section"><h4>Google Sheets (car &amp; expenses)</h4>
        <p>Two-way sync with <b>Hyundai Elantra</b> and your <b>Expenses</b> workbook, through a Google Apps Script you deploy once.</p>
        <div class="btn-row"><button class="btn btn-ghost" id="openSheets">${icon('sheet', 15)} Google Sheets sync</button></div>
      </div>
      <div class="set-section"><h4>Sync across devices</h4>
        <p>Keep this browser and your phone (<b>Second Brain Mobile.html</b>) in step through one private GitHub gist.</p>
        <div class="btn-row"><button class="btn btn-ghost" id="openSync">${icon('cloud', 15)} Open sync panel</button></div>
      </div>
      <div class="set-section"><h4>Keyboard shortcuts</h4>
        <div class="shortcuts">
          <div>Search everything <span><span class="kbd">Ctrl</span> <span class="kbd">K</span></span></div>
          <div>New item in current section <span class="kbd">N</span></div>
          <div>Jump to section <span><span class="kbd">Alt</span> <span class="kbd">1–9</span></span></div>
          <div>Save open form <span><span class="kbd">Ctrl</span> <span class="kbd">Enter</span></span></div>
          <div>Close dialog / search <span class="kbd">Esc</span></div>
          <div>Focus search <span class="kbd">/</span></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Close</button><button class="btn btn-primary" id="saveSettings">${icon('check', 15)} Save settings</button></div>`, true);

  $('#saveSettings', m).onclick = () => {
    DB.settings.name = $('#setName', m).value.trim();
    DB.settings.currency = $('#setCur', m).value || '$';
    DB.settings.studyWeekly = Math.max(0, num($('#setStudy', m).value));
    DB.settings.exerciseWeekly = Math.max(0, num($('#setEx', m).value));
    DB.settings.ts = Date.now();
    saveDB(); closeModal(); render(); toast('Settings saved');
  };
  $('#expJson', m).onclick = () => {
    download(`second-brain-backup-${today()}.json`, JSON.stringify({ app: 'Second Brain', exported: new Date().toISOString(), ...DB }, null, 2), 'application/json');
    toast('Backup downloaded');
  };
  $('#impJson', m).onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (typeof data !== 'object' || !['projects', 'tasks', 'notes'].some(k => Array.isArray(data[k]))) throw new Error('Not a Second Brain backup');
        confirmDialog('Replace current data?', `This will replace everything in this browser with <b>${esc(file.name)}</b>.`, 'Import & replace', () => {
          DB = normalizeDB(data); delete DB.app; delete DB.exported;
          saveDB(); render(); toast('Backup imported');
        });
      } catch (err) { toast('That file is not a valid Second Brain backup', { tone: 'error' }); }
    };
    reader.readAsText(file);
  };
  $$('[data-csv]', m).forEach(b => { b.onclick = () => exportCSV(b.dataset.csv); });
  $('#openSync', m).onclick = () => Sync.openPanel();
  $('#openSheets', m).onclick = () => Sheets.openPanel();
  $('#loadDemo', m).onclick = () => confirmDialog('Load demo data?', 'Your current data will be replaced with sample projects, tasks, finances and more. Export a backup first if you want to keep it.', 'Load demo data', () => {
    const keep = DB.settings; DB = seedDB(); DB.settings = keep; saveDB(); render(); toast('Demo data loaded');
  });
  $('#eraseAll', m).onclick = () => confirmDialog('Erase all data?', 'Every project, task, transaction, journal entry, habit, study session, workout, course and note will be permanently removed from this browser. <b>This cannot be undone.</b>', 'Erase everything', () => {
    const keep = DB.settings; DB = emptyDB(); DB.settings = keep; UI.journalSel = null; UI.habitSel = 'all'; saveDB(); render(); toast('All data erased');
  });
}

/* =========================================================
   23. SHELL WIRING + KEYBOARD SHORTCUTS + BOOT
   ========================================================= */
function toggleSidebar(open) {
  $('#sidebar').classList.toggle('open', open);
  $('#scrim').classList.toggle('open', open);
}
function openNewMenu() {
  const menu = $('#newMenu');
  menu.innerHTML = ['tasks', 'projects', 'notes', 'journal', 'habits', 'study', 'workouts', 'transactions', 'courses', 'goals'].map(t => `<button data-new="${t}">${icon(TYPE_META[t].icon, 16)} ${FORMS[t].noun}</button>`).join('');
  menu.classList.toggle('open');
}
function wireShell() {
  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
  $('#settingsBtn').addEventListener('click', () => { toggleSidebar(false); openSettings(); });
  $('#syncBtn').addEventListener('click', () => { toggleSidebar(false); Sync.openPanel(); });
  $('#sheetsBtn').addEventListener('click', () => { toggleSidebar(false); Sheets.openPanel(); });
  $('#menuBtn').addEventListener('click', () => toggleSidebar(true));
  $('#scrim').addEventListener('click', () => toggleSidebar(false));
  $('#newBtn').addEventListener('click', e => {
    e.stopPropagation();
    if (UI.view === 'car') { openSheetForm(UI.carTab === 'fuel' ? 'fuel' : 'service'); return; }
    if (UI.view === 'finances' && (UI.finTab === 'sheet' || (UI.finTab === 'transactions' && usingSheets()))) { openSheetForm('expense'); return; }
    const t = currentAddType();
    t ? openForm(t) : openNewMenu();
  });
  $('#newMenu').addEventListener('click', e => { const b = e.target.closest('[data-new]'); if (!b) return; $('#newMenu').classList.remove('open'); openForm(b.dataset.new); });
  document.addEventListener('click', e => { if (!e.target.closest('.new-wrap')) $('#newMenu').classList.remove('open'); });

  document.addEventListener('keydown', e => {
    const typing = e.target.closest('input, textarea, select, [contenteditable]');
    const modalOpen = !!$('.overlay:not(.closing)');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!modalOpen) { $('#searchInput').focus(); $('#searchInput').select(); } return; }
    if (e.key === 'Escape') {
      if (modalOpen) { closeModal(); return; }
      $('#newMenu').classList.remove('open'); toggleSidebar(false); return;
    }
    if (typing || modalOpen || e.ctrlKey || e.metaKey) return;
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && UI.view === 'finances' && UI.finTab === 'cards') {
      e.preventDefault(); cycleCard(e.key === 'ArrowRight' ? 1 : -1); return;
    }
    if (e.key === '/') { e.preventDefault(); $('#searchInput').focus(); }
    else if (e.key.toLowerCase() === 'n' && !e.altKey) { e.preventDefault(); const t = currentAddType(); t ? openForm(t) : openNewMenu(); }
    else if (e.altKey && /^[1-9]$/.test(e.key)) { e.preventDefault(); go(Object.keys(VIEWS)[+e.key - 1]); }
  });
}
function hydrateStaticIcons() {
  $$('svg[data-icon]').forEach(s => { s.outerHTML = icon(s.dataset.icon, +(s.dataset.size || 18)); });
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('#searchKbd').textContent = '⌘ K';
}

(function boot() {
  DB = loadDB();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { toast('Browser storage is unavailable — changes will not persist', { tone: 'error' }); }
  try { const v = localStorage.getItem('secondBrain.view'); if (VIEWS[v]) UI.view = v; } catch (e) { /* ignore */ }
  hydrateStaticIcons();
  renderNav();
  wireShell();
  wireSearch();
  wireView();
  render();
  Sync.init();
  Sheets.init();
  // Refresh relative dates ("Today", "Overdue") if the app stays open past midnight
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (!$('.overlay')) render(); } }, 60000);
})();
</script>
